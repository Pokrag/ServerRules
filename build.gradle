plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.pokrag'
version = '1.0'
description = 'ServerRules - regles, plaintes et serments pour serveur Paper'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.257-stable'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'

    // SQLite embarque (le plugin Paper ne fournit pas de driver JDBC).
    // slf4j est exclu : Paper en fournit deja un.
    implementation('org.xerial:sqlite-jdbc:3.54.1.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// Un seul JAR final : celui du shadowJar (SQLite inclus). Le jar simple est desactive.
tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    // Fusionne les fichiers META-INF/services : indispensable pour que le
    // pilote SQLite (java.sql.Driver) soit bien enregistre dans le JAR final.
    mergeServiceFiles()
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}
