# ServerRules - Русский
prefix: "<dark_gray>[<green>ServerRules<dark_gray>] <reset>"

error:
  vault-missing: "Vault не установлен. ServerRules требует Vault."
  economy-missing: "В Vault не зарегистрирован поставщик экономики. Установите EssentialsX и включите его экономику."
  economy-not-essentials: "Поставщик экономики Vault — не EssentialsX (найден: {provider}). ServerRules требует EssentialsX."
  database: "Произошла внутренняя ошибка базы данных. Повторите попытку."
  invalid-amount: "Сумма недействительна."
  invalid-duration: "Длительность недействительна."
  fine-refused: "Плагин экономики отказал в списании (возможно, отрицательные балансы отключены)."
  ban-failed: "Бан не удалось применить."

rules:
  header: "<dark_gray>------- <green>Правила сервера <dark_gray>-------"
  footer: "<dark_gray>----------------------------"
  row: "<yellow>{number}. <white>{name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
  empty: "<gray>Правила ещё не заданы."
  not-found: "<red>Правило {number} не существует."
  single-header: "<dark_gray>------- <green>Правило {number} <dark_gray>-------"
  sanction:
    fine: "<red>Штраф: {amount}"
    temp-ban: "<red>Временный бан: {duration}"
  changes:
    header: "<dark_gray>--- <green>Изменения правил с вашего последнего визита <dark_gray>---"
    added: "<green>[+] Правило {number}. {name}"
    modified: "<yellow>[~] Правило {number}. {name}"
    removed: "<red>[-] Правило {number}. {name}"
    none: "<gray>Нет изменений правил с вашего последнего визита."
    footer: "<gray>Введите <white>{rules-command} <gray>, чтобы увидеть все правила."
  admin:
    usage:
      add: "<gray>Использование: <white>{rules-command} add <имя> <fine|ban> <значение> [описание]"
      edit: "<gray>Использование: <white>{rules-command} edit <№> <имя> <fine|ban> <значение> [описание]"
      remove: "<gray>Использование: <white>{rules-command} remove <№>"
      move: "<gray>Использование: <white>{rules-command} move <№> <позиция>"
    pending-header: "<gold>Ожидаемое изменение:"
    pending-add: "<green>[+] Правило {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-edit: "<yellow>[~] Правило {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-remove: "<red>[-] Правило {number}. {name}"
    pending-note: "<gray>Подтвердите с помощью <click:run_command:'{confirm}'><green>[Подтвердить]</click> <gray>или отмените с <click:run_command:'{cancel}'><red>[Отмена]</click> <gray>в течение {timeout} секунд."
    confirmed: "<green>Изменение применено."
    cancelled: "<gray>Ожидаемое изменение отменено."
    nothing-pending: "<red>Нет ожидаемого изменения для подтверждения."
    pending-expired: "<red>Ваше ожидаемое изменение истекло. Начните заново."
    moved: "<green>Правило перемещено: {number} -> {position}."
    invalid-position: "<red>Неверная позиция: {position}."
    reloaded: "<green>Конфигурация, языки и правила перезагружены."

complaint:
  usage: "<gray>Использование: <white>/plaint <игрок> <номер правила> <подробности>"
  players-only: "<red>Только игрок может подать жалобу."
  deposited: "<green>Ваша жалоба #{id} отправлена судьям."
  cooldown: "<red>Подождите {time}, прежде чем подать новую жалобу."
  rule-not-found: "<red>Правило {number} не существует."
  oath-invalid: "<red>Ссылка на клятву {reference} недействительна. Используйте oath:<№>."
  player-not-found: "<red>Игрок {player} неизвестен."
  self: "<red>Вы не можете подать жалобу на самого себя."
  list:
    header: "<dark_gray>--- <green>Жалобы <dark_gray>---"
    empty: "<gray>Нет жалоб для отображения."
    row: "<yellow>#{id} <gray>{plaintiff} <dark_gray>-> <gray>{accused} <dark_gray>| {citation} <dark_gray>| <gray>{date} <dark_gray>| {status}"
  detail:
    header: "<dark_gray>--- <green>Жалоба #{id} <dark_gray>---"
    plaintiff: "<gray>Истец: <white>{plaintiff}"
    accused: "<gray>Обвиняемый: <white>{accused}"
    citation: "<gray>Ссылается на: <white>{citation}"
    sanction: "<gray>Планируемая санкция: {sanction}"
    details: "<gray>Подробности: <white>{details}"
    date: "<gray>Дата: <white>{date}"
    status: "<gray>Статус: {status}"
  status:
    pending: "<yellow>в ожидании"
    handled: "<green>обработана"
    dismissed: "<gray>отклонена"
    sanction-to-execute: "<gold>санкция к исполнению"

citation:
  rule: "<white>Правило {number} <gray>({name})"
  oath: "<white>Клятва #{id}"

judge:
  notify: "<gold>Новая жалоба #{id} <gray>от <white>{plaintiff} <gray>против <white>{accused}<gray>."
  pending-on-join: "<gold>{count} жалоб(а) ожидают вашего решения."
  not-found: "<red>Жалоба #{id} не существует."
  conflict: "<red>Вы вовлечены в жалобу #{id} и не можете её рассматривать."
  invalid-status: "<red>Неизвестный статус. Используйте: pending, handled, dismissed."
  superjudge-only: "<red>Только верховный судья может изменить указанное правило."
  rule-changed: "<green>Жалоба #{id}: указанное правило изменено с <white>{old} <green>на <white>{new}<green>."
  sanction-applied: "<green>Жалоба #{id} обработана: {sanction}"
  sanction-failed: "<red>Санкцию не удалось применить: {error}"
  out-of-range: "<red>Значение вне диапазона. Допустимо: от {min} до {max}."
  invalid-value: "<red>Недействительное значение."
  no-modulation: "<red>Эта ссылка не может быть изменена."
  custom-manual: "<red>Это пользовательская санкция: её нельзя применить автоматически. Используйте /judge done после исполнения."
  custom-to-execute: "<gold>Жалоба #{id}: пользовательская санкция. Исполните её, затем отметьте жалобу как выполненную."
  done-not-custom: "<red>Только пользовательскую санкцию можно отметить как выполненную."
  dismissed: "<gray>Жалоба #{id} отклонена без дальнейших действий."
  done: "<green>Жалоба #{id} отмечена как выполненная."
  ban-reason: "Нарушение правил сервера - {citation} (жалоба #{id})"

oath:
  usage:
    general: "<gray>Использование: <white>{oath-command} <create|join|accept|refuse|info|cancel>"
    create: "<gray>Использование: <white>{oath-command} create <длительность> fine <сумма> <обещание> <dark_gray>| <gray>{oath-command} create <длительность> ban <длительность-бана> <обещание> <dark_gray>| <gray>{oath-command} create <длительность> custom \"<санкция>\" <обещание>"
    join: "<gray>Использование: <white>{oath-command} join <код>"
    info: "<gray>Использование: <white>{oath-command} info <№>"
    cancel: "<gray>Использование: <white>{oath-command} cancel <№>"
  players-only: "<red>Только игрок может использовать клятвы."
  not-found: "<red>Клятва #{id} не существует."
  status:
    proposed: "<yellow>предложена"
    proposal-expired: "<gray>предложение истекло"
    active: "<green>активна"
    expired: "<gray>истекла"
    cancelled: "<gray>отменена"
    broken: "<red>нарушена"
    handled: "<green>обработана"
  create:
    created: "<green>Клятва #{id} создана. Поделитесь кодом, чтобы другие могли присоединиться."
    code: "<gray>Код: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    code-validity: "<gray>Код действителен в течение <white>{time}<gray>."
    invalid-duration: "<red>Длительность клятвы недействительна."
    invalid-value: "<red>Значение санкции недействительно."
  recap:
    header: "<dark_gray>--- <green>Клятва #{id} <dark_gray>---"
    founder: "<gray>Основатель: <white>{founder}"
    parties: "<gray>Стороны: <white>{parties}"
    promise: "<gray>Обещание: <white>{promise}"
    duration: "<gray>Длительность: <white>{duration}"
    sanction: "<gray>Санкция при нарушении: {sanction}"
    status: "<gray>Статус: {status}"
    code: "<gray>Код для присоединения: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
  join:
    prompt: "<gray>Примите с помощью <click:run_command:'{accept}'><green>[Принять]</click> <gray>или откажитесь с <click:run_command:'{refuse}'><red>[Отказаться]</click>."
    lockout: "<red>Слишком много неверных кодов. Повторите попытку через {time}."
    invalid: "<red>Этот код клятвы недействителен или истёк."
    already-member: "<red>Вы уже являетесь стороной этой клятвы."
    full: "<red>Эта клятва достигла максимального числа сторон."
    none-pending: "<red>У вас нет ожидающего приглашения к клятве."
    accepted: "<green>Вы присоединились к клятве #{id}."
    refused: "<gray>Вы отклонили приглашение к клятве #{id}."
    joined-notify: "<green>{player} присоединился к вашей клятве #{id}."
    activated: "<green>Клятва #{id} теперь активна с {count} сторонами."
  cancel:
    not-allowed: "<red>Клятва #{id} больше не может быть отменена."
    not-party: "<red>Вы не являетесь стороной клятвы #{id}."
    requested: "<gold>Вы запросили отмену клятвы #{id}. Остальные стороны должны подтвердить."
    confirm-request: "<gold>{player} хочет отменить клятву #{id}. <click:run_command:'{confirm}'><green>[Подтвердить]</click>"
    already-requested: "<gray>Вы уже запросили отмену клятвы #{id}. Ожидание остальных сторон."
    confirmed: "<green>Вы подтвердили отмену клятвы #{id}. Ожидание остальных сторон."
    cancelled: "<gray>Клятва #{id} была отменена всеми сторонами."
  complaint:
    not-party: "<red>Вы не являетесь стороной этой клятвы."
    not-allowed: "<red>На эту клятву нельзя ссылаться: она отменена или вне срока подачи жалобы."
