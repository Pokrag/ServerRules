# ServerRules - 日本語
prefix: "<dark_gray>[<green>ServerRules<dark_gray>] <reset>"

error:
  vault-missing: "Vault がインストールされていません。ServerRules には Vault が必要です。"
  economy-missing: "Vault に登録された経済プロバイダーがありません。EssentialsX を導入し、その経済機能を有効にしてください。"
  economy-not-essentials: "Vault の経済プロバイダーが EssentialsX ではありません（検出: {provider}）。ServerRules には EssentialsX が必要です。"
  database: "内部データベースエラーが発生しました。もう一度お試しください。"
  invalid-amount: "金額が無効です。"
  invalid-duration: "期間が無効です。"
  fine-refused: "経済プラグインが引き出しを拒否しました（マイナス残高が無効になっている可能性があります）。"
  ban-failed: "BAN を適用できませんでした。"

rules:
  header: "<dark_gray>------- <green>サーバールール <dark_gray>-------"
  footer: "<dark_gray>----------------------------"
  row: "<yellow>{number}. <white>{name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
  empty: "<gray>まだルールが設定されていません。"
  not-found: "<red>ルール {number} は存在しません。"
  single-header: "<dark_gray>------- <green>ルール {number} <dark_gray>-------"
  sanction:
    fine: "<red>罰金：{amount}"
    temp-ban: "<red>一時BAN：{duration}"
  changes:
    header: "<dark_gray>--- <green>前回の参加以降のルール変更 <dark_gray>---"
    added: "<green>[+] ルール {number}. {name}"
    modified: "<yellow>[~] ルール {number}. {name}"
    removed: "<red>[-] ルール {number}. {name}"
    none: "<gray>前回の参加以降、ルールの変更はありません。"
    footer: "<gray>すべてのルールを見るには <white>{rules-command} <gray>と入力してください。"
  admin:
    usage:
      add: "<gray>使用方法：<white>{rules-command} add <名前> <fine|ban> <値> [説明]"
      edit: "<gray>使用方法：<white>{rules-command} edit <番号> <名前> <fine|ban> <値> [説明]"
      remove: "<gray>使用方法：<white>{rules-command} remove <番号>"
      move: "<gray>使用方法：<white>{rules-command} move <番号> <位置>"
    pending-header: "<gold>保留中の変更："
    pending-add: "<green>[+] ルール {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-edit: "<yellow>[~] ルール {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-remove: "<red>[-] ルール {number}. {name}"
    pending-note: "<gray><click:run_command:'{confirm}'><green>[確認]</click> <gray>で確定、<click:run_command:'{cancel}'><red>[キャンセル]</click> <gray>で取り消し（{timeout} 秒以内）。"
    confirmed: "<green>変更が適用されました。"
    cancelled: "<gray>保留中の変更は取り消されました。"
    nothing-pending: "<red>確定する保留中の変更はありません。"
    pending-expired: "<red>保留中の変更が期限切れになりました。最初からやり直してください。"
    moved: "<green>ルールを移動しました：{number} -> {position}。"
    invalid-position: "<red>無効な位置：{position}。"
    reloaded: "<green>設定、言語、ルールを再読み込みしました。"

complaint:
  usage: "<gray>使用方法：<white>/plaint <プレイヤー> <ルール番号> <詳細>"
  players-only: "<red>苦情を提出できるのはプレイヤーのみです。"
  deposited: "<green>あなたの苦情 #{id} が裁判官に送信されました。"
  cooldown: "<red>次の苦情を提出する前に {time} お待ちください。"
  rule-not-found: "<red>ルール {number} は存在しません。"
  oath-invalid: "<red>誓いの参照 {reference} は無効です。oath:<id> を使用してください。"
  player-not-found: "<red>プレイヤー {player} は不明です。"
  self: "<red>自分自身に対して苦情を提出することはできません。"
  list:
    header: "<dark_gray>--- <green>苦情 <dark_gray>---"
    empty: "<gray>表示する苦情がありません。"
    row: "<yellow>#{id} <gray>{plaintiff} <dark_gray>-> <gray>{accused} <dark_gray>| {citation} <dark_gray>| <gray>{date} <dark_gray>| {status}"
  detail:
    header: "<dark_gray>--- <green>苦情 #{id} <dark_gray>---"
    plaintiff: "<gray>原告：<white>{plaintiff}"
    accused: "<gray>被告：<white>{accused}"
    citation: "<gray>引用：<white>{citation}"
    sanction: "<gray>予定された制裁：{sanction}"
    details: "<gray>詳細：<white>{details}"
    date: "<gray>日付：<white>{date}"
    status: "<gray>ステータス：{status}"
  status:
    pending: "<yellow>保留中"
    handled: "<green>処理済み"
    dismissed: "<gray>却下"
    sanction-to-execute: "<gold>執行すべき制裁"

citation:
  rule: "<white>ルール {number} <gray>({name})"
  oath: "<white>誓い #{id}"

judge:
  notify: "<gold>新しい苦情 #{id} <gray>：<white>{plaintiff} <gray>から <white>{accused}<gray> へ。"
  pending-on-join: "<gold>{count} 件の苦情があなたの判断を待っています。"
  not-found: "<red>苦情 #{id} は存在しません。"
  conflict: "<red>あなたは苦情 #{id} に関与しているため、処理できません。"
  invalid-status: "<red>不明なステータスです。使用可能：pending、handled、dismissed。"
  superjudge-only: "<red>引用されたルールを変更できるのはスーパー裁判官のみです。"
  rule-changed: "<green>苦情 #{id}：引用されたルールが <white>{old} <green>から <white>{new}<green> に変更されました。"
  sanction-applied: "<green>苦情 #{id} を処理しました：{sanction}"
  sanction-failed: "<red>制裁を適用できませんでした：{error}"
  out-of-range: "<red>値が範囲外です。許可範囲：{min} ～ {max}。"
  invalid-value: "<red>無効な値です。"
  no-modulation: "<red>この引用は調整できません。"
  custom-manual: "<red>これはカスタム制裁です：自動的に適用できません。執行後に /judge done を使用してください。"
  custom-to-execute: "<gold>苦情 #{id}：カスタム制裁です。執行した後、苦情を完了としてマークしてください。"
  done-not-custom: "<red>完了としてマークできるのはカスタム制裁のみです。"
  dismissed: "<gray>苦情 #{id} はそれ以上の措置なく却下されました。"
  done: "<green>苦情 #{id} を完了としてマークしました。"
  ban-reason: "サーバールール違反 - {citation} (苦情 #{id})"

oath:
  usage:
    general: "<gray>使用方法：<white>{oath-command} <create|join|accept|refuse|info|cancel>"
    create: "<gray>使用方法：<white>{oath-command} create <期間> fine <金額> <約束> <dark_gray>| <gray>{oath-command} create <期間> ban <ban期間> <約束> <dark_gray>| <gray>{oath-command} create <期間> custom \"<制裁>\" <約束>"
    join: "<gray>使用方法：<white>{oath-command} join <コード>"
    info: "<gray>使用方法：<white>{oath-command} info <ID>"
    cancel: "<gray>使用方法：<white>{oath-command} cancel <ID>"
  players-only: "<red>誓いはプレイヤーのみが使用できます。"
  not-found: "<red>誓い #{id} は存在しません。"
  status:
    proposed: "<yellow>提案済み"
    proposal-expired: "<gray>提案が期限切れ"
    active: "<green>有効"
    expired: "<gray>期限切れ"
    cancelled: "<gray>キャンセル済み"
    broken: "<red>不履行"
    handled: "<green>処理済み"
  create:
    created: "<green>誓い #{id} を作成しました。他のプレイヤーが参加できるようコードを共有してください。"
    code: "<gray>コード：<gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    code-validity: "<gray>コードは <white>{time}<gray> の間有効です。"
    invalid-duration: "<red>誓いの期間が無効です。"
    invalid-value: "<red>制裁の値が無効です。"
  recap:
    header: "<dark_gray>--- <green>誓い #{id} <dark_gray>---"
    founder: "<gray>創設者：<white>{founder}"
    parties: "<gray>当事者：<white>{parties}"
    promise: "<gray>約束：<white>{promise}"
    duration: "<gray>期間：<white>{duration}"
    sanction: "<gray>違反時の制裁：{sanction}"
    status: "<gray>ステータス：{status}"
    code: "<gray>参加コード：<gold><click:copy_to_clipboard:'{code}'>{code}</click>"
  join:
    prompt: "<gray>承認するには <click:run_command:'{accept}'><green>[承認]</click> <gray>、拒否するには <click:run_command:'{refuse}'><red>[拒否]</click> <gray>を押してください。"
    lockout: "<red>コードの誤入力が多すぎます。{time} 後に再試行してください。"
    invalid: "<red>この誓いのコードは無効か、期限切れです。"
    already-member: "<red>あなたはすでにこの誓いの当事者です。"
    full: "<red>この誓いは当事者の上限に達しています。"
    none-pending: "<red>保留中の誓いの招待はありません。"
    accepted: "<green>誓い #{id} に参加しました。"
    refused: "<gray>誓い #{id} への招待を拒否しました。"
    joined-notify: "<green>{player} があなたの誓い #{id} に参加しました。"
    activated: "<green>誓い #{id} が {count} 人の当事者で有効になりました。"
  cancel:
    not-allowed: "<red>誓い #{id} はもうキャンセルできません。"
    not-party: "<red>あなたは誓い #{id} の当事者ではありません。"
    requested: "<gold>誓い #{id} のキャンセルを要求しました。他の当事者が確認する必要があります。"
    confirm-request: "<gold>{player} が誓い #{id} のキャンセルを希望しています。<click:run_command:'{confirm}'><green>[確認]</click>"
    already-requested: "<gray>誓い #{id} のキャンセルはすでに要求済みです。他の当事者を待っています。"
    confirmed: "<green>誓い #{id} のキャンセルを確認しました。他の当事者を待っています。"
    cancelled: "<gray>誓い #{id} はすべての当事者によってキャンセルされました。"
  complaint:
    not-party: "<red>あなたはこの誓いの当事者ではありません。"
    not-allowed: "<red>この誓いは引用できません：キャンセル済みか、苦情の期限外です。"

