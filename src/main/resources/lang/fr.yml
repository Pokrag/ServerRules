# ServerRules - Français
prefix: "<dark_gray>[<green>ServerRules<dark_gray>] <reset>"

error:
  vault-missing: "Vault n'est pas installé. ServerRules nécessite Vault."
  economy-missing: "Aucun fournisseur d'économie n'est enregistré auprès de Vault. Installez EssentialsX et activez son économie."
  economy-not-essentials: "Le fournisseur d'économie Vault n'est pas EssentialsX (trouvé : {provider}). ServerRules nécessite EssentialsX."
  database: "Une erreur interne de base de données est survenue. Réessayez."
  invalid-amount: "Le montant est invalide."
  invalid-duration: "La durée est invalide."
  fine-refused: "Le plugin d'économie a refusé le retrait (les soldes négatifs sont peut-être désactivés)."
  ban-failed: "Le bannissement n'a pas pu être appliqué."
  invalid-sanction: "La sanction personnalisée est invalide."

rules:
  header: "<dark_gray>------- <green>Règles du serveur <dark_gray>-------"
  footer: "<dark_gray>----------------------------"
  row: "<yellow>{number}. <white>{name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
  empty: "<gray>Aucune règle n'a encore été définie."
  not-found: "<red>La règle {number} n'existe pas."
  single-header: "<dark_gray>------- <green>Règle {number} <dark_gray>-------"
  sanction:
    fine: "<red>Amende : {amount}"
    temp-ban: "<red>Bannissement temporaire : {duration}"
    custom: "<red>Sanction : {text}"
  changes:
    header: "<dark_gray>--- <green>Changements de règles depuis votre dernière visite <dark_gray>---"
    added: "<green>[+] Règle {number}. {name}"
    modified: "<yellow>[~] Règle {number}. {name}"
    removed: "<red>[-] Règle {number}. {name}"
    none: "<gray>Aucun changement de règle depuis votre dernière visite."
    footer: "<gray>Tapez <white>{rules-command} <gray>pour voir toutes les règles."
  admin:
    usage:
      add: "<gray>Utilisation : <white>{rules-command} add <nom> <fine|ban> <valeur> [description]"
      edit: "<gray>Utilisation : <white>{rules-command} edit <n°> <nom> <fine|ban> <valeur> [description]"
      remove: "<gray>Utilisation : <white>{rules-command} remove <n°>"
      move: "<gray>Utilisation : <white>{rules-command} move <n°> <position>"
    pending-header: "<gold>Modification en attente :"
    pending-add: "<green>[+] Règle {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-edit: "<yellow>[~] Règle {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-remove: "<red>[-] Règle {number}. {name}"
    pending-note: "<gray>Confirmez avec <click:run_command:'{confirm}'><green>[Confirmer]</click> <gray>ou annulez avec <click:run_command:'{cancel}'><red>[Annuler]</click> <gray>dans les {timeout} secondes."
    confirmed: "<green>La modification a été appliquée."
    cancelled: "<gray>La modification en attente a été annulée."
    nothing-pending: "<red>Aucune modification en attente à confirmer."
    pending-expired: "<red>Votre modification en attente a expiré. Recommencez."
    moved: "<green>Règle déplacée : {number} -> {position}."
    invalid-position: "<red>Position invalide : {position}."
    reloaded: "<green>Configuration, langues et règles rechargées."

complaint:
  usage: "<gray>Utilisation : <white>/plaint <joueur> <n° de règle> <détails>"
  players-only: "<red>Seul un joueur peut déposer une plainte."
  deposited: "<green>Votre plainte #{id} a été envoyée aux juges."
  cooldown: "<red>Patientez {time} avant de déposer une nouvelle plainte."
  rule-not-found: "<red>La règle {number} n'existe pas."
  oath-invalid: "<red>La référence de serment {reference} est invalide. Utilisez oath:<n°>."
  player-not-found: "<red>Le joueur {player} est inconnu."
  self: "<red>Vous ne pouvez pas porter plainte contre vous-même."
  list:
    header: "<dark_gray>--- <green>Plaintes <dark_gray>---"
    empty: "<gray>Aucune plainte à afficher."
    row: "<yellow>#{id} <gray>{plaintiff} <dark_gray>-> <gray>{accused} <dark_gray>| {citation} <dark_gray>| <gray>{date} <dark_gray>| {status}"
  detail:
    header: "<dark_gray>--- <green>Plainte #{id} <dark_gray>---"
    plaintiff: "<gray>Plaignant : <white>{plaintiff}"
    accused: "<gray>Accusé : <white>{accused}"
    citation: "<gray>Cité : <white>{citation}"
    sanction: "<gray>Sanction prévue : {sanction}"
    details: "<gray>Détails : <white>{details}"
    date: "<gray>Date : <white>{date}"
    status: "<gray>Statut : {status}"
  status:
    pending: "<yellow>en attente"
    handled: "<green>traitée"
    dismissed: "<gray>classée sans suite"
    sanction-to-execute: "<gold>sanction à exécuter"

citation:
  rule: "<white>Règle {number} <gray>({name})"
  oath: "<white>Serment #{id}"

judge:
  notify: "<gold>Nouvelle plainte #{id} <gray>de <white>{plaintiff} <gray>contre <white>{accused}<gray>."
  pending-on-join: "<gold>{count} plainte(s) en attente de votre jugement."
  not-found: "<red>La plainte #{id} n'existe pas."
  conflict: "<red>Vous êtes impliqué dans la plainte #{id} et ne pouvez pas la traiter."
  invalid-status: "<red>Statut inconnu. Utilisez : pending, handled, dismissed."
  superjudge-only: "<red>Seul un superjuge peut changer la règle citée."
  rule-changed: "<green>Plainte #{id} : règle citée changée de <white>{old} <green>à <white>{new}<green>."
  sanction-applied: "<green>Plainte #{id} traitée : {sanction}"
  sanction-failed: "<red>La sanction n'a pas pu être appliquée : {error}"
  out-of-range: "<red>Valeur hors limites. Autorisé : de {min} à {max}."
  invalid-value: "<red>Valeur invalide."
  no-modulation: "<red>Cette citation ne peut pas être modulée."
  custom-manual: "<red>Sanction personnalisée : elle ne peut pas être appliquée automatiquement. Utilisez /judge done une fois exécutée."
  custom-to-execute: "<gold>Plainte #{id} : sanction personnalisée. Exécutez-la, puis marquez la plainte comme exécutée."
  ai-disabled: "<gray>Traitement IA des sanctions désactivé (aucune clé API). Appliquez cette sanction personnalisée manuellement en tant qu'administrateur."
  ai-passed: "<gray>L'IA laisse cette sanction personnalisée à votre jugement."
  ai-applied: "<green>L'IA a appliqué la sanction : <white>{command}"
  ai-failed: "<red>L'IA n'a pas pu appliquer cette sanction personnalisée. Traitez-la manuellement."
  ai-no-credit: "<red>L'IA (OpenRouter) n'a plus de crédit. Traitez cette sanction personnalisée manuellement."
  done-not-custom: "<red>Seule une sanction personnalisée peut être marquée comme exécutée."
  dismissed: "<gray>Plainte #{id} classée sans suite."
  done: "<green>Plainte #{id} marquée comme exécutée."
  ban-reason: "Infraction aux règles du serveur - {citation} (plainte #{id})"

oath:
  usage:
    general: "<gray>Utilisation : <white>{oath-command} <create|join|accept|refuse|info|cancel>"
    create: "<gray>Utilisation : <white>{oath-command} create <durée> fine <montant> <promesse> <dark_gray>| <gray>{oath-command} create <durée> ban <durée-ban> <promesse> <dark_gray>| <gray>{oath-command} create <durée> custom \"<sanction>\" <promesse>"
    join: "<gray>Utilisation : <white>{oath-command} join <code>"
    info: "<gray>Utilisation : <white>{oath-command} info <n°>"
    cancel: "<gray>Utilisation : <white>{oath-command} cancel <n°>"
  players-only: "<red>Seul un joueur peut utiliser les serments."
  not-found: "<red>Le serment #{id} n'existe pas."
  duration:
    infinite: "<white>illimitée"
  status:
    proposed: "<yellow>proposé"
    proposal-expired: "<gray>proposition expirée"
    active: "<green>actif"
    expired: "<gray>expiré"
    cancelled: "<gray>annulé"
    broken: "<red>non respecté"
    handled: "<green>traité"
  create:
    created: "<green>Serment #{id} créé. Partagez le code pour que d'autres le rejoignent."
    code: "<gray>Code : <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    code-validity: "<gray>Le code est valable pendant <white>{time}<gray>."
    invalid-duration: "<red>La durée du serment est invalide."
    invalid-value: "<red>La valeur de la sanction est invalide."
  recap:
    header: "<dark_gray>--- <green>Serment #{id} <dark_gray>---"
    founder: "<gray>Fondateur : <white>{founder}"
    parties: "<gray>Parties : <white>{parties}"
    promise: "<gray>Promesse : <white>{promise}"
    duration: "<gray>Durée : <white>{duration}"
    sanction: "<gray>Sanction en cas de manquement : {sanction}"
    status: "<gray>Statut : {status}"
    code: "<gray>Code d'adhésion : <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
  join:
    prompt: "<gray>Acceptez avec <click:run_command:'{accept}'><green>[Accepter]</click> <gray>ou refusez avec <click:run_command:'{refuse}'><red>[Refuser]</click>."
    lockout: "<red>Trop de codes erronés. Réessayez dans {time}."
    invalid: "<red>Ce code de serment est invalide ou a expiré."
    already-member: "<red>Vous êtes déjà partie à ce serment."
    full: "<red>Ce serment a atteint son nombre maximum de parties."
    none-pending: "<red>Vous n'avez aucune invitation de serment en attente."
    accepted: "<green>Vous avez rejoint le serment #{id}."
    refused: "<gray>Vous avez refusé l'invitation au serment #{id}."
    joined-notify: "<green>{player} a rejoint votre serment #{id}."
    activated: "<green>Le serment #{id} est désormais actif avec {count} parties."
  cancel:
    not-allowed: "<red>Le serment #{id} ne peut plus être annulé."
    not-party: "<red>Vous n'êtes pas partie au serment #{id}."
    requested: "<gold>Vous avez demandé l'annulation du serment #{id}. Les autres parties doivent confirmer."
    confirm-request: "<gold>{player} souhaite annuler le serment #{id}. <click:run_command:'{confirm}'><green>[Confirmer]</click>"
    already-requested: "<gray>Vous avez déjà demandé l'annulation du serment #{id}. En attente des autres parties."
    confirmed: "<green>Vous avez confirmé l'annulation du serment #{id}. En attente des autres parties."
    cancelled: "<gray>Le serment #{id} a été annulé par toutes les parties."
  complaint:
    not-party: "<red>Vous n'êtes pas partie à ce serment."
    not-allowed: "<red>Ce serment ne peut pas être cité : il est annulé ou hors du délai de plainte."

