# ServerRules - 한국어
prefix: "<dark_gray>[<green>ServerRules<dark_gray>] <reset>"

error:
  vault-missing: "Vault가 설치되어 있지 않습니다. ServerRules에는 Vault가 필요합니다."
  economy-missing: "Vault에 등록된 경제 제공자가 없습니다. EssentialsX를 설치하고 경제 기능을 활성화하세요."
  economy-not-essentials: "Vault 경제 제공자가 EssentialsX가 아닙니다(발견: {provider}). ServerRules에는 EssentialsX가 필요합니다."
  database: "내부 데이터베이스 오류가 발생했습니다. 다시 시도하세요."
  invalid-amount: "금액이 유효하지 않습니다."
  invalid-duration: "기간이 유효하지 않습니다."
  fine-refused: "경제 플러그인이 출금을 거부했습니다(마이너스 잔액이 비활성화되어 있을 수 있습니다)."
  ban-failed: "밴을 적용할 수 없습니다."

rules:
  header: "<dark_gray>------- <green>서버 규칙 <dark_gray>-------"
  footer: "<dark_gray>----------------------------"
  row: "<yellow>{number}. <white>{name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
  empty: "<gray>아직 규칙이 정의되지 않았습니다."
  not-found: "<red>규칙 {number}이(가) 존재하지 않습니다."
  single-header: "<dark_gray>------- <green>규칙 {number} <dark_gray>-------"
  sanction:
    fine: "<red>벌금: {amount}"
    temp-ban: "<red>임시 밴: {duration}"
  changes:
    header: "<dark_gray>--- <green>지난 방문 이후 규칙 변경 <dark_gray>---"
    added: "<green>[+] 규칙 {number}. {name}"
    modified: "<yellow>[~] 규칙 {number}. {name}"
    removed: "<red>[-] 규칙 {number}. {name}"
    none: "<gray>지난 방문 이후 규칙 변경이 없습니다."
    footer: "<gray>모든 규칙을 보려면 <white>{rules-command} <gray>를 입력하세요."
  admin:
    usage:
      add: "<gray>사용법: <white>{rules-command} add <이름> <fine|ban> <값> [설명]"
      edit: "<gray>사용법: <white>{rules-command} edit <번호> <이름> <fine|ban> <값> [설명]"
      remove: "<gray>사용법: <white>{rules-command} remove <번호>"
      move: "<gray>사용법: <white>{rules-command} move <번호> <위치>"
    pending-header: "<gold>대기 중인 변경:"
    pending-add: "<green>[+] 규칙 {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-edit: "<yellow>[~] 규칙 {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-remove: "<red>[-] 규칙 {number}. {name}"
    pending-note: "<gray><click:run_command:'{confirm}'><green>[확인]</click> <gray>로 확인하거나 <click:run_command:'{cancel}'><red>[취소]</click> <gray>로 취소하세요({timeout}초 이내)."
    confirmed: "<green>변경이 적용되었습니다."
    cancelled: "<gray>대기 중인 변경이 취소되었습니다."
    nothing-pending: "<red>확인할 대기 중인 변경이 없습니다."
    pending-expired: "<red>대기 중인 변경이 만료되었습니다. 다시 시작하세요."
    moved: "<green>규칙 이동됨: {number} -> {position}."
    invalid-position: "<red>유효하지 않은 위치: {position}."
    reloaded: "<green>설정, 언어 및 규칙이 다시 로드되었습니다."

complaint:
  usage: "<gray>사용법: <white>/plaint <플레이어> <규칙 번호> <세부 사항>"
  players-only: "<red>민원은 플레이어만 제출할 수 있습니다."
  deposited: "<green>귀하의 민원 #{id}이(가) 판사에게 전송되었습니다."
  cooldown: "<red>다른 민원을 제출하기 전에 {time} 기다려 주세요."
  rule-not-found: "<red>규칙 {number}이(가) 존재하지 않습니다."
  oath-invalid: "<red>맹세 참조 {reference}이(가) 유효하지 않습니다. oath:<id>를 사용하세요."
  player-not-found: "<red>플레이어 {player}을(를) 알 수 없습니다."
  self: "<red>자신을 상대로 민원을 제출할 수 없습니다."
  list:
    header: "<dark_gray>--- <green>민원 <dark_gray>---"
    empty: "<gray>표시할 민원이 없습니다."
    row: "<yellow>#{id} <gray>{plaintiff} <dark_gray>-> <gray>{accused} <dark_gray>| {citation} <dark_gray>| <gray>{date} <dark_gray>| {status}"
  detail:
    header: "<dark_gray>--- <green>민원 #{id} <dark_gray>---"
    plaintiff: "<gray>원고: <white>{plaintiff}"
    accused: "<gray>피고: <white>{accused}"
    citation: "<gray>인용: <white>{citation}"
    sanction: "<gray>예정된 제재: {sanction}"
    details: "<gray>세부 사항: <white>{details}"
    date: "<gray>날짜: <white>{date}"
    status: "<gray>상태: {status}"
  status:
    pending: "<yellow>대기 중"
    handled: "<green>처리됨"
    dismissed: "<gray>기각됨"
    sanction-to-execute: "<gold>집행할 제재"

citation:
  rule: "<white>규칙 {number} <gray>({name})"
  oath: "<white>맹세 #{id}"

judge:
  notify: "<gold>새 민원 #{id} <gray>- <white>{plaintiff} <gray>이(가) <white>{accused}<gray>을(를) 상대로 제기했습니다."
  pending-on-join: "<gold>{count}건의 민원이 귀하의 판결을 기다리고 있습니다."
  not-found: "<red>민원 #{id}이(가) 존재하지 않습니다."
  conflict: "<red>귀하는 민원 #{id}에 연루되어 있어 처리할 수 없습니다."
  invalid-status: "<red>알 수 없는 상태입니다. 사용: pending, handled, dismissed."
  superjudge-only: "<red>인용된 규칙을 변경할 수 있는 것은 슈퍼 판사뿐입니다."
  rule-changed: "<green>민원 #{id}: 인용된 규칙이 <white>{old} <green>에서 <white>{new}<green>(으)로 변경되었습니다."
  sanction-applied: "<green>민원 #{id} 처리됨: {sanction}"
  sanction-failed: "<red>제재를 적용할 수 없습니다: {error}"
  out-of-range: "<red>값이 범위를 벗어났습니다. 허용 범위: {min} ~ {max}."
  invalid-value: "<red>유효하지 않은 값입니다."
  no-modulation: "<red>이 인용은 조정할 수 없습니다."
  custom-manual: "<red>이것은 사용자 지정 제재입니다: 자동으로 적용할 수 없습니다. 집행 후 /judge done을 사용하세요."
  custom-to-execute: "<gold>민원 #{id}: 사용자 지정 제재입니다. 집행한 후 민원을 완료로 표시하세요."
  done-not-custom: "<red>사용자 지정 제재만 완료로 표시할 수 있습니다."
  dismissed: "<gray>민원 #{id}이(가) 더 이상의 조치 없이 기각되었습니다."
  done: "<green>민원 #{id}을(를) 완료로 표시했습니다."
  ban-reason: "서버 규칙 위반 - {citation} (민원 #{id})"

oath:
  usage:
    general: "<gray>사용법: <white>{oath-command} <create|join|accept|refuse|info|cancel>"
    create: "<gray>사용법: <white>{oath-command} create <기간> fine <금액> <약속> <dark_gray>| <gray>{oath-command} create <기간> ban <밴 기간> <약속> <dark_gray>| <gray>{oath-command} create <기간> custom \"<제재>\" <약속>"
    join: "<gray>사용법: <white>{oath-command} join <코드>"
    info: "<gray>사용법: <white>{oath-command} info <ID>"
    cancel: "<gray>사용법: <white>{oath-command} cancel <ID>"
  players-only: "<red>맹세는 플레이어만 사용할 수 있습니다."
  not-found: "<red>맹세 #{id}이(가) 존재하지 않습니다."
  status:
    proposed: "<yellow>제안됨"
    proposal-expired: "<gray>제안 만료됨"
    active: "<green>활성"
    expired: "<gray>만료됨"
    cancelled: "<gray>취소됨"
    broken: "<red>위반됨"
    handled: "<green>처리됨"
  create:
    created: "<green>맹세 #{id}이(가) 생성되었습니다. 다른 사람이 참여할 수 있도록 코드를 공유하세요."
    code: "<gray>코드: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    code-validity: "<gray>코드는 <white>{time}<gray> 동안 유효합니다."
    invalid-duration: "<red>맹세 기간이 유효하지 않습니다."
    invalid-value: "<red>제재 값이 유효하지 않습니다."
  recap:
    header: "<dark_gray>--- <green>맹세 #{id} <dark_gray>---"
    founder: "<gray>창시자: <white>{founder}"
    parties: "<gray>당사자: <white>{parties}"
    promise: "<gray>약속: <white>{promise}"
    duration: "<gray>기간: <white>{duration}"
    sanction: "<gray>위반 시 제재: {sanction}"
    status: "<gray>상태: {status}"
    code: "<gray>참여 코드: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
  join:
    prompt: "<gray><click:run_command:'{accept}'><green>[수락]</click> <gray>으로 수락하고, <click:run_command:'{refuse}'><red>[거부]</click> <gray>로 거부하세요."
    lockout: "<red>잘못된 코드가 너무 많습니다. {time} 후에 다시 시도하세요."
    invalid: "<red>이 맹세 코드는 유효하지 않거나 만료되었습니다."
    already-member: "<red>당신은 이미 이 맹세의 당사자입니다."
    full: "<red>이 맹세는 최대 당사자 수에 도달했습니다."
    none-pending: "<red>대기 중인 맹세 초대가 없습니다."
    accepted: "<green>맹세 #{id}에 참여했습니다."
    refused: "<gray>맹세 #{id} 초대를 거부했습니다."
    joined-notify: "<green>{player}이(가) 당신의 맹세 #{id}에 참여했습니다."
    activated: "<green>맹세 #{id}이(가) {count}명의 당사자로 활성화되었습니다."
  cancel:
    not-allowed: "<red>맹세 #{id}은(는) 더 이상 취소할 수 없습니다."
    not-party: "<red>당신은 맹세 #{id}의 당사자가 아닙니다."
    requested: "<gold>맹세 #{id}의 취소를 요청했습니다. 다른 당사자들이 확인해야 합니다."
    confirm-request: "<gold>{player}이(가) 맹세 #{id}를 취소하려 합니다. <click:run_command:'{confirm}'><green>[확인]</click>"
    already-requested: "<gray>맹세 #{id}의 취소는 이미 요청되었습니다. 다른 당사자들을 기다리는 중입니다."
    confirmed: "<green>맹세 #{id}의 취소를 확인했습니다. 다른 당사자들을 기다리는 중입니다."
    cancelled: "<gray>맹세 #{id}이(가) 모든 당사자에 의해 취소되었습니다."
  complaint:
    not-party: "<red>당신은 이 맹세의 당사자가 아닙니다."
    not-allowed: "<red>이 맹세는 인용할 수 없습니다: 취소되었거나 민원 기한을 벗어났습니다."
