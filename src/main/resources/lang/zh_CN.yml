# ServerRules - 简体中文
prefix: "<dark_gray>[<green>ServerRules<dark_gray>] <reset>"

error:
  vault-missing: "未安装 Vault。ServerRules 需要 Vault。"
  economy-missing: "Vault 没有注册任何经济提供者。请安装 EssentialsX 并启用其经济功能。"
  economy-not-essentials: "Vault 的经济提供者不是 EssentialsX（检测到：{provider}）。ServerRules 需要 EssentialsX。"
  database: "发生内部数据库错误。请重试。"
  invalid-amount: "金额无效。"
  invalid-duration: "时长无效。"
  fine-refused: "经济插件拒绝了扣款（可能已禁用负余额）。"
  ban-failed: "无法应用封禁。"

rules:
  header: "<dark_gray>------- <green>服务器规则 <dark_gray>-------"
  footer: "<dark_gray>----------------------------"
  row: "<yellow>{number}. <white>{name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
  empty: "<gray>尚未定义任何规则。"
  not-found: "<red>规则 {number} 不存在。"
  single-header: "<dark_gray>------- <green>规则 {number} <dark_gray>-------"
  sanction:
    fine: "<red>罚款：{amount}"
    temp-ban: "<red>临时封禁：{duration}"
  changes:
    header: "<dark_gray>--- <green>自上次访问以来的规则变更 <dark_gray>---"
    added: "<green>[+] 规则 {number}. {name}"
    modified: "<yellow>[~] 规则 {number}. {name}"
    removed: "<red>[-] 规则 {number}. {name}"
    none: "<gray>自上次访问以来没有规则变更。"
    footer: "<gray>输入 <white>{rules-command} <gray>查看所有规则。"
  admin:
    usage:
      add: "<gray>用法：<white>{rules-command} add <名称> <fine|ban> <数值> [描述]"
      edit: "<gray>用法：<white>{rules-command} edit <编号> <名称> <fine|ban> <数值> [描述]"
      remove: "<gray>用法：<white>{rules-command} remove <编号>"
      move: "<gray>用法：<white>{rules-command} move <编号> <位置>"
    pending-header: "<gold>待处理的更改："
    pending-add: "<green>[+] 规则 {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-edit: "<yellow>[~] 规则 {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-remove: "<red>[-] 规则 {number}. {name}"
    pending-note: "<gray>点击 <click:run_command:'{confirm}'><green>[确认]</click> <gray>确认，或点击 <click:run_command:'{cancel}'><red>[取消]</click> <gray>取消（{timeout} 秒内）。"
    confirmed: "<green>更改已应用。"
    cancelled: "<gray>待处理的更改已取消。"
    nothing-pending: "<red>没有待确认的更改。"
    pending-expired: "<red>你的待处理更改已过期。请重新开始。"
    moved: "<green>规则已移动：{number} -> {position}。"
    invalid-position: "<red>无效的位置：{position}。"
    reloaded: "<green>配置、语言和规则已重新加载。"

complaint:
  usage: "<gray>用法：<white>/plaint <玩家> <规则编号> <详情>"
  players-only: "<red>只有玩家才能提交投诉。"
  deposited: "<green>你的投诉 #{id} 已发送给法官。"
  cooldown: "<red>请等待 {time} 后再提交新的投诉。"
  rule-not-found: "<red>规则 {number} 不存在。"
  oath-invalid: "<red>誓言引用 {reference} 无效。请使用 oath:<id>。"
  player-not-found: "<red>玩家 {player} 未知。"
  self: "<red>你不能对自己提交投诉。"
  list:
    header: "<dark_gray>--- <green>投诉 <dark_gray>---"
    empty: "<gray>没有可显示的投诉。"
    row: "<yellow>#{id} <gray>{plaintiff} <dark_gray>-> <gray>{accused} <dark_gray>| {citation} <dark_gray>| <gray>{date} <dark_gray>| {status}"
  detail:
    header: "<dark_gray>--- <green>投诉 #{id} <dark_gray>---"
    plaintiff: "<gray>原告：<white>{plaintiff}"
    accused: "<gray>被告：<white>{accused}"
    citation: "<gray>引用：<white>{citation}"
    sanction: "<gray>预定处罚：{sanction}"
    details: "<gray>详情：<white>{details}"
    date: "<gray>日期：<white>{date}"
    status: "<gray>状态：{status}"
  status:
    pending: "<yellow>待处理"
    handled: "<green>已处理"
    dismissed: "<gray>已驳回"
    sanction-to-execute: "<gold>待执行的处罚"

citation:
  rule: "<white>规则 {number} <gray>({name})"
  oath: "<white>誓言 #{id}"

judge:
  notify: "<gold>新投诉 #{id} <gray>来自 <white>{plaintiff} <gray>针对 <white>{accused}<gray>。"
  pending-on-join: "<gold>{count} 条投诉等待你的裁决。"
  not-found: "<red>投诉 #{id} 不存在。"
  conflict: "<red>你涉及投诉 #{id}，无法处理它。"
  invalid-status: "<red>未知状态。可用：pending、handled、dismissed。"
  superjudge-only: "<red>只有超级法官才能更改引用的规则。"
  rule-changed: "<green>投诉 #{id}：引用的规则已从 <white>{old} <green>更改为 <white>{new}<green>。"
  sanction-applied: "<green>投诉 #{id} 已处理：{sanction}"
  sanction-failed: "<red>无法应用处罚：{error}"
  out-of-range: "<red>数值超出范围。允许范围：{min} 至 {max}。"
  invalid-value: "<red>数值无效。"
  no-modulation: "<red>此引用无法调整。"
  custom-manual: "<red>这是自定义处罚：无法自动应用。执行后使用 /judge done。"
  custom-to-execute: "<gold>投诉 #{id}：自定义处罚。执行后，将投诉标记为已完成。"
  done-not-custom: "<red>只有自定义处罚才能标记为已完成。"
  dismissed: "<gray>投诉 #{id} 已驳回，无需进一步处理。"
  done: "<green>投诉 #{id} 已标记为已完成。"
  ban-reason: "违反服务器规则 - {citation}（投诉 #{id}）"

oath:
  usage:
    general: "<gray>用法：<white>{oath-command} <create|join|accept|refuse|info|cancel>"
    create: "<gray>用法：<white>{oath-command} create <时长> fine <金额> <承诺> <dark_gray>| <gray>{oath-command} create <时长> ban <封禁时长> <承诺> <dark_gray>| <gray>{oath-command} create <时长> custom \"<处罚>\" <承诺>"
    join: "<gray>用法：<white>{oath-command} join <代码>"
    info: "<gray>用法：<white>{oath-command} info <ID>"
    cancel: "<gray>用法：<white>{oath-command} cancel <ID>"
  players-only: "<red>只有玩家才能使用誓言。"
  not-found: "<red>誓言 #{id} 不存在。"
  status:
    proposed: "<yellow>已提议"
    proposal-expired: "<gray>提议已过期"
    active: "<green>生效中"
    expired: "<gray>已过期"
    cancelled: "<gray>已取消"
    broken: "<red>已违背"
    handled: "<green>已处理"
  create:
    created: "<green>誓言 #{id} 已创建。分享代码以便他人加入。"
    code: "<gray>代码：<gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    code-validity: "<gray>代码在 <white>{time}<gray> 内有效。"
    invalid-duration: "<red>誓言时长无效。"
    invalid-value: "<red>处罚数值无效。"
  recap:
    header: "<dark_gray>--- <green>誓言 #{id} <dark_gray>---"
    founder: "<gray>发起者：<white>{founder}"
    parties: "<gray>参与方：<white>{parties}"
    promise: "<gray>承诺：<white>{promise}"
    duration: "<gray>时长：<white>{duration}"
    sanction: "<gray>违背时的处罚：{sanction}"
    status: "<gray>状态：{status}"
    code: "<gray>加入代码：<gold><click:copy_to_clipboard:'{code}'>{code}</click>"
  join:
    prompt: "<gray>点击 <click:run_command:'{accept}'><green>[接受]</click> <gray>接受，或点击 <click:run_command:'{refuse}'><red>[拒绝]</click> <gray>拒绝。"
    lockout: "<red>错误代码过多。请在 {time} 后重试。"
    invalid: "<red>此誓言代码无效或已过期。"
    already-member: "<red>你已经是此誓言的参与方。"
    full: "<red>此誓言已达最大参与方数量。"
    none-pending: "<red>你没有待处理的誓言邀请。"
    accepted: "<green>你已加入誓言 #{id}。"
    refused: "<gray>你拒绝了加入誓言 #{id} 的邀请。"
    joined-notify: "<green>{player} 加入了你的誓言 #{id}。"
    activated: "<green>誓言 #{id} 现已生效，共有 {count} 个参与方。"
  cancel:
    not-allowed: "<red>誓言 #{id} 无法再取消。"
    not-party: "<red>你不是誓言 #{id} 的参与方。"
    requested: "<gold>你请求取消誓言 #{id}。其他参与方必须确认。"
    confirm-request: "<gold>{player} 想要取消誓言 #{id}。<click:run_command:'{confirm}'><green>[确认]</click>"
    already-requested: "<gray>你已请求取消誓言 #{id}。正在等待其他参与方。"
    confirmed: "<green>你已确认取消誓言 #{id}。正在等待其他参与方。"
    cancelled: "<gray>誓言 #{id} 已被所有参与方取消。"
  complaint:
    not-party: "<red>你不是此誓言的参与方。"
    not-allowed: "<red>此誓言无法被引用：它已取消或超出投诉期限。"
