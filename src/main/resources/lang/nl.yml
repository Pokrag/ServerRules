# ServerRules - Nederlands
prefix: "<dark_gray>[<green>ServerRules<dark_gray>] <reset>"

error:
  vault-missing: "Vault is niet geïnstalleerd. ServerRules vereist Vault."
  economy-missing: "Er is geen economieprovider geregistreerd bij Vault. Installeer EssentialsX en schakel de economie in."
  economy-not-essentials: "De economieprovider van Vault is niet EssentialsX (gevonden: {provider}). ServerRules vereist EssentialsX."
  database: "Er is een interne databasefout opgetreden. Probeer het opnieuw."
  invalid-amount: "Het bedrag is ongeldig."
  invalid-duration: "De duur is ongeldig."
  fine-refused: "De economieplugin heeft de afschrijving geweigerd (negatieve saldo's zijn mogelijk uitgeschakeld)."
  ban-failed: "De ban kon niet worden toegepast."

rules:
  header: "<dark_gray>------- <green>Serverregels <dark_gray>-------"
  footer: "<dark_gray>----------------------------"
  row: "<yellow>{number}. <white>{name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
  empty: "<gray>Er zijn nog geen regels ingesteld."
  not-found: "<red>Regel {number} bestaat niet."
  single-header: "<dark_gray>------- <green>Regel {number} <dark_gray>-------"
  sanction:
    fine: "<red>Boete: {amount}"
    temp-ban: "<red>Tijdelijke ban: {duration}"
  changes:
    header: "<dark_gray>--- <green>Regelwijzigingen sinds je laatste bezoek <dark_gray>---"
    added: "<green>[+] Regel {number}. {name}"
    modified: "<yellow>[~] Regel {number}. {name}"
    removed: "<red>[-] Regel {number}. {name}"
    none: "<gray>Geen regelwijzigingen sinds je laatste bezoek."
    footer: "<gray>Typ <white>{rules-command} <gray>om alle regels te zien."
  admin:
    usage:
      add: "<gray>Gebruik: <white>{rules-command} add <naam> <fine|ban> <waarde> [beschrijving]"
      edit: "<gray>Gebruik: <white>{rules-command} edit <regel> <naam> <fine|ban> <waarde> [beschrijving]"
      remove: "<gray>Gebruik: <white>{rules-command} remove <regel>"
      move: "<gray>Gebruik: <white>{rules-command} move <regel> <positie>"
    pending-header: "<gold>Wijziging in behandeling:"
    pending-add: "<green>[+] Regel {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-edit: "<yellow>[~] Regel {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-remove: "<red>[-] Regel {number}. {name}"
    pending-note: "<gray>Bevestig met <click:run_command:'{confirm}'><green>[Bevestigen]</click> <gray>of annuleer met <click:run_command:'{cancel}'><red>[Annuleren]</click> <gray>binnen {timeout} seconden."
    confirmed: "<green>De wijziging is toegepast."
    cancelled: "<gray>De wijziging in behandeling is geannuleerd."
    nothing-pending: "<red>Er is geen wijziging in behandeling om te bevestigen."
    pending-expired: "<red>Je wijziging in behandeling is verlopen. Begin opnieuw."
    moved: "<green>Regel verplaatst: {number} -> {position}."
    invalid-position: "<red>Ongeldige positie: {position}."
    reloaded: "<green>Configuratie, talen en regels opnieuw geladen."

complaint:
  usage: "<gray>Gebruik: <white>/plaint <speler> <regelnummer> <details>"
  players-only: "<red>Alleen een speler kan een klacht indienen."
  deposited: "<green>Je klacht #{id} is naar de rechters verzonden."
  cooldown: "<red>Wacht {time} voordat je een nieuwe klacht indient."
  rule-not-found: "<red>Regel {number} bestaat niet."
  oath-invalid: "<red>De eedreferentie {reference} is ongeldig. Gebruik oath:<id>."
  player-not-found: "<red>Speler {player} is onbekend."
  self: "<red>Je kunt geen klacht tegen jezelf indienen."
  list:
    header: "<dark_gray>--- <green>Klachten <dark_gray>---"
    empty: "<gray>Geen klachten om weer te geven."
    row: "<yellow>#{id} <gray>{plaintiff} <dark_gray>-> <gray>{accused} <dark_gray>| {citation} <dark_gray>| <gray>{date} <dark_gray>| {status}"
  detail:
    header: "<dark_gray>--- <green>Klacht #{id} <dark_gray>---"
    plaintiff: "<gray>Aanklager: <white>{plaintiff}"
    accused: "<gray>Beschuldigde: <white>{accused}"
    citation: "<gray>Aangehaald: <white>{citation}"
    sanction: "<gray>Geplande sanctie: {sanction}"
    details: "<gray>Details: <white>{details}"
    date: "<gray>Datum: <white>{date}"
    status: "<gray>Status: {status}"
  status:
    pending: "<yellow>in behandeling"
    handled: "<green>afgehandeld"
    dismissed: "<gray>geseponeerd"
    sanction-to-execute: "<gold>sanctie om uit te voeren"

citation:
  rule: "<white>Regel {number} <gray>({name})"
  oath: "<white>Eed #{id}"

judge:
  notify: "<gold>Nieuwe klacht #{id} <gray>van <white>{plaintiff} <gray>tegen <white>{accused}<gray>."
  pending-on-join: "<gold>{count} klacht(en) wachten op je oordeel."
  not-found: "<red>Klacht #{id} bestaat niet."
  conflict: "<red>Je bent betrokken bij klacht #{id} en kunt deze niet behandelen."
  invalid-status: "<red>Onbekende status. Gebruik: pending, handled, dismissed."
  superjudge-only: "<red>Alleen een opperrechter kan de aangehaalde regel wijzigen."
  rule-changed: "<green>Klacht #{id}: aangehaalde regel gewijzigd van <white>{old} <green>naar <white>{new}<green>."
  sanction-applied: "<green>Klacht #{id} behandeld: {sanction}"
  sanction-failed: "<red>De sanctie kon niet worden toegepast: {error}"
  out-of-range: "<red>Waarde buiten bereik. Toegestaan: {min} tot {max}."
  invalid-value: "<red>Ongeldige waarde."
  no-modulation: "<red>Deze aanhaling kan niet worden aangepast."
  custom-manual: "<red>Dit is een aangepaste sanctie: ze kan niet automatisch worden toegepast. Gebruik /judge done zodra ze is uitgevoerd."
  custom-to-execute: "<gold>Klacht #{id}: aangepaste sanctie. Voer ze uit en markeer de klacht daarna als afgehandeld."
  done-not-custom: "<red>Alleen een aangepaste sanctie kan als afgehandeld worden gemarkeerd."
  dismissed: "<gray>Klacht #{id} geseponeerd zonder verdere actie."
  done: "<green>Klacht #{id} als afgehandeld gemarkeerd."
  ban-reason: "Schending van de serverregels - {citation} (klacht #{id})"

oath:
  usage:
    general: "<gray>Gebruik: <white>{oath-command} <create|join|accept|refuse|info|cancel>"
    create: "<gray>Gebruik: <white>{oath-command} create <duur> fine <bedrag> <belofte> <dark_gray>| <gray>{oath-command} create <duur> ban <ban-duur> <belofte> <dark_gray>| <gray>{oath-command} create <duur> custom \"<sanctie>\" <belofte>"
    join: "<gray>Gebruik: <white>{oath-command} join <code>"
    info: "<gray>Gebruik: <white>{oath-command} info <id>"
    cancel: "<gray>Gebruik: <white>{oath-command} cancel <id>"
  players-only: "<red>Alleen een speler kan eden gebruiken."
  not-found: "<red>Eed #{id} bestaat niet."
  status:
    proposed: "<yellow>voorgesteld"
    proposal-expired: "<gray>voorstel verlopen"
    active: "<green>actief"
    expired: "<gray>verlopen"
    cancelled: "<gray>geannuleerd"
    broken: "<red>verbroken"
    handled: "<green>afgehandeld"
  create:
    created: "<green>Eed #{id} aangemaakt. Deel de code zodat anderen kunnen deelnemen."
    code: "<gray>Code: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    code-validity: "<gray>De code is geldig gedurende <white>{time}<gray>."
    invalid-duration: "<red>De duur van de eed is ongeldig."
    invalid-value: "<red>De waarde van de sanctie is ongeldig."
  recap:
    header: "<dark_gray>--- <green>Eed #{id} <dark_gray>---"
    founder: "<gray>Oprichter: <white>{founder}"
    parties: "<gray>Partijen: <white>{parties}"
    promise: "<gray>Belofte: <white>{promise}"
    duration: "<gray>Duur: <white>{duration}"
    sanction: "<gray>Sanctie bij verbreking: {sanction}"
    status: "<gray>Status: {status}"
    code: "<gray>Deelnamecode: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
  join:
    prompt: "<gray>Accepteer met <click:run_command:'{accept}'><green>[Accepteren]</click> <gray>of weiger met <click:run_command:'{refuse}'><red>[Weigeren]</click>."
    lockout: "<red>Te veel ongeldige codes. Probeer het opnieuw over {time}."
    invalid: "<red>Deze eedcode is ongeldig of verlopen."
    already-member: "<red>Je bent al partij bij deze eed."
    full: "<red>Deze eed heeft het maximum aantal partijen bereikt."
    none-pending: "<red>Je hebt geen openstaande eeduitnodiging."
    accepted: "<green>Je bent toegetreden tot eed #{id}."
    refused: "<gray>Je hebt de uitnodiging voor eed #{id} geweigerd."
    joined-notify: "<green>{player} is toegetreden tot je eed #{id}."
    activated: "<green>Eed #{id} is nu actief met {count} partijen."
  cancel:
    not-allowed: "<red>Eed #{id} kan niet meer worden geannuleerd."
    not-party: "<red>Je bent geen partij bij eed #{id}."
    requested: "<gold>Je hebt de annulering van eed #{id} aangevraagd. De andere partijen moeten bevestigen."
    confirm-request: "<gold>{player} wil eed #{id} annuleren. <click:run_command:'{confirm}'><green>[Bevestigen]</click>"
    already-requested: "<gray>Je hebt de annulering van eed #{id} al aangevraagd. Wachten op de andere partijen."
    confirmed: "<green>Je hebt de annulering van eed #{id} bevestigd. Wachten op de andere partijen."
    cancelled: "<gray>Eed #{id} is door alle partijen geannuleerd."
  complaint:
    not-party: "<red>Je bent geen partij bij deze eed."
    not-allowed: "<red>Deze eed kan niet worden aangehaald: hij is geannuleerd of buiten het klachtvenster."

gui:
