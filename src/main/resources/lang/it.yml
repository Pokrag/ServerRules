# ServerRules - Italiano
prefix: "<dark_gray>[<green>ServerRules<dark_gray>] <reset>"

error:
  vault-missing: "Vault non è installato. ServerRules richiede Vault."
  economy-missing: "Nessun fornitore di economia è registrato in Vault. Installa EssentialsX e attiva la sua economia."
  economy-not-essentials: "Il fornitore di economia di Vault non è EssentialsX (trovato: {provider}). ServerRules richiede EssentialsX."
  database: "Si è verificato un errore interno del database. Riprova."
  invalid-amount: "L'importo non è valido."
  invalid-duration: "La durata non è valida."
  fine-refused: "Il plugin dell'economia ha rifiutato l'addebito (i saldi negativi potrebbero essere disattivati)."
  ban-failed: "Non è stato possibile applicare il ban."

rules:
  header: "<dark_gray>------- <green>Regole del server <dark_gray>-------"
  footer: "<dark_gray>----------------------------"
  row: "<yellow>{number}. <white>{name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
  empty: "<gray>Non è ancora stata definita alcuna regola."
  not-found: "<red>La regola {number} non esiste."
  single-header: "<dark_gray>------- <green>Regola {number} <dark_gray>-------"
  sanction:
    fine: "<red>Multa: {amount}"
    temp-ban: "<red>Ban temporaneo: {duration}"
  changes:
    header: "<dark_gray>--- <green>Modifiche alle regole dalla tua ultima visita <dark_gray>---"
    added: "<green>[+] Regola {number}. {name}"
    modified: "<yellow>[~] Regola {number}. {name}"
    removed: "<red>[-] Regola {number}. {name}"
    none: "<gray>Nessuna modifica alle regole dalla tua ultima visita."
    footer: "<gray>Scrivi <white>{rules-command} <gray>per vedere tutte le regole."
  admin:
    usage:
      add: "<gray>Utilizzo: <white>{rules-command} add <nome> <fine|ban> <valore> [descrizione]"
      edit: "<gray>Utilizzo: <white>{rules-command} edit <n°> <nome> <fine|ban> <valore> [descrizione]"
      remove: "<gray>Utilizzo: <white>{rules-command} remove <n°>"
      move: "<gray>Utilizzo: <white>{rules-command} move <n°> <posizione>"
    pending-header: "<gold>Modifica in sospeso:"
    pending-add: "<green>[+] Regola {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-edit: "<yellow>[~] Regola {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-remove: "<red>[-] Regola {number}. {name}"
    pending-note: "<gray>Conferma con <click:run_command:'{confirm}'><green>[Conferma]</click> <gray>o annulla con <click:run_command:'{cancel}'><red>[Annulla]</click> <gray>entro {timeout} secondi."
    confirmed: "<green>La modifica è stata applicata."
    cancelled: "<gray>La modifica in sospeso è stata annullata."
    nothing-pending: "<red>Non c'è alcuna modifica in sospeso da confermare."
    pending-expired: "<red>La tua modifica in sospeso è scaduta. Ricomincia."
    moved: "<green>Regola spostata: {number} -> {position}."
    invalid-position: "<red>Posizione non valida: {position}."
    reloaded: "<green>Configurazione, lingue e regole ricaricate."

complaint:
  usage: "<gray>Utilizzo: <white>/plaint <giocatore> <n° di regola> <dettagli>"
  players-only: "<red>Solo un giocatore può presentare una denuncia."
  deposited: "<green>La tua denuncia #{id} è stata inviata ai giudici."
  cooldown: "<red>Attendi {time} prima di presentare un'altra denuncia."
  rule-not-found: "<red>La regola {number} non esiste."
  oath-invalid: "<red>Il riferimento del giuramento {reference} non è valido. Usa oath:<n°>."
  player-not-found: "<red>Il giocatore {player} è sconosciuto."
  self: "<red>Non puoi presentare una denuncia contro te stesso."
  list:
    header: "<dark_gray>--- <green>Denunce <dark_gray>---"
    empty: "<gray>Nessuna denuncia da mostrare."
    row: "<yellow>#{id} <gray>{plaintiff} <dark_gray>-> <gray>{accused} <dark_gray>| {citation} <dark_gray>| <gray>{date} <dark_gray>| {status}"
  detail:
    header: "<dark_gray>--- <green>Denuncia #{id} <dark_gray>---"
    plaintiff: "<gray>Denunciante: <white>{plaintiff}"
    accused: "<gray>Accusato: <white>{accused}"
    citation: "<gray>Citato: <white>{citation}"
    sanction: "<gray>Sanzione prevista: {sanction}"
    details: "<gray>Dettagli: <white>{details}"
    date: "<gray>Data: <white>{date}"
    status: "<gray>Stato: {status}"
  status:
    pending: "<yellow>in sospeso"
    handled: "<green>gestita"
    dismissed: "<gray>archiviata"
    sanction-to-execute: "<gold>sanzione da eseguire"

citation:
  rule: "<white>Regola {number} <gray>({name})"
  oath: "<white>Giuramento #{id}"

judge:
  notify: "<gold>Nuova denuncia #{id} <gray>da <white>{plaintiff} <gray>contro <white>{accused}<gray>."
  pending-on-join: "<gold>{count} denuncia/e in attesa del tuo giudizio."
  not-found: "<red>La denuncia #{id} non esiste."
  conflict: "<red>Sei coinvolto nella denuncia #{id} e non puoi gestirla."
  invalid-status: "<red>Stato sconosciuto. Usa: pending, handled, dismissed."
  superjudge-only: "<red>Solo un supergiudice può cambiare la regola citata."
  rule-changed: "<green>Denuncia #{id}: regola citata cambiata da <white>{old} <green>a <white>{new}<green>."
  sanction-applied: "<green>Denuncia #{id} gestita: {sanction}"
  sanction-failed: "<red>Non è stato possibile applicare la sanzione: {error}"
  out-of-range: "<red>Valore fuori intervallo. Consentito: da {min} a {max}."
  invalid-value: "<red>Valore non valido."
  no-modulation: "<red>Questa citazione non può essere modulata."
  custom-manual: "<red>Si tratta di una sanzione personalizzata: non può essere applicata automaticamente. Usa /judge done una volta eseguita."
  custom-to-execute: "<gold>Denuncia #{id}: sanzione personalizzata. Esegui la sanzione, poi segna la denuncia come gestita."
  done-not-custom: "<red>Solo una sanzione personalizzata può essere segnata come gestita."
  dismissed: "<gray>Denuncia #{id} archiviata senza ulteriori azioni."
  done: "<green>Denuncia #{id} segnata come gestita."
  ban-reason: "Violazione delle regole del server - {citation} (denuncia #{id})"

oath:
  usage:
    general: "<gray>Utilizzo: <white>{oath-command} <create|join|accept|refuse|info|cancel>"
    create: "<gray>Utilizzo: <white>{oath-command} create <durata> fine <importo> <promessa> <dark_gray>| <gray>{oath-command} create <durata> ban <durata-ban> <promessa> <dark_gray>| <gray>{oath-command} create <durata> custom \"<sanzione>\" <promessa>"
    join: "<gray>Utilizzo: <white>{oath-command} join <codice>"
    info: "<gray>Utilizzo: <white>{oath-command} info <n°>"
    cancel: "<gray>Utilizzo: <white>{oath-command} cancel <n°>"
  players-only: "<red>Solo un giocatore può usare i giuramenti."
  not-found: "<red>Il giuramento #{id} non esiste."
  status:
    proposed: "<yellow>proposto"
    proposal-expired: "<gray>proposta scaduta"
    active: "<green>attivo"
    expired: "<gray>scaduto"
    cancelled: "<gray>annullato"
    broken: "<red>non mantenuto"
    handled: "<green>trattato"
  create:
    created: "<green>Giuramento #{id} creato. Condividi il codice così altri possono unirsi."
    code: "<gray>Codice: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    code-validity: "<gray>Il codice è valido per <white>{time}<gray>."
    invalid-duration: "<red>La durata del giuramento non è valida."
    invalid-value: "<red>Il valore della sanzione non è valido."
  recap:
    header: "<dark_gray>--- <green>Giuramento #{id} <dark_gray>---"
    founder: "<gray>Fondatore: <white>{founder}"
    parties: "<gray>Parti: <white>{parties}"
    promise: "<gray>Promessa: <white>{promise}"
    duration: "<gray>Durata: <white>{duration}"
    sanction: "<gray>Sanzione in caso di mancamento: {sanction}"
    status: "<gray>Stato: {status}"
    code: "<gray>Codice di adesione: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
  join:
    prompt: "<gray>Accetta con <click:run_command:'{accept}'><green>[Accetta]</click> <gray>o rifiuta con <click:run_command:'{refuse}'><red>[Rifiuta]</click>."
    lockout: "<red>Troppi codici errati. Riprova tra {time}."
    invalid: "<red>Questo codice di giuramento non è valido o è scaduto."
    already-member: "<red>Sei già parte di questo giuramento."
    full: "<red>Questo giuramento ha raggiunto il numero massimo di parti."
    none-pending: "<red>Non hai alcun invito a un giuramento in sospeso."
    accepted: "<green>Ti sei unito al giuramento #{id}."
    refused: "<gray>Hai rifiutato l'invito al giuramento #{id}."
    joined-notify: "<green>{player} si è unito al tuo giuramento #{id}."
    activated: "<green>Il giuramento #{id} è ora attivo con {count} parti."
  cancel:
    not-allowed: "<red>Il giuramento #{id} non può più essere annullato."
    not-party: "<red>Non sei parte del giuramento #{id}."
    requested: "<gold>Hai richiesto l'annullamento del giuramento #{id}. Le altre parti devono confermare."
    confirm-request: "<gold>{player} vuole annullare il giuramento #{id}. <click:run_command:'{confirm}'><green>[Conferma]</click>"
    already-requested: "<gray>Hai già richiesto l'annullamento del giuramento #{id}. In attesa delle altre parti."
    confirmed: "<green>Hai confermato l'annullamento del giuramento #{id}. In attesa delle altre parti."
    cancelled: "<gray>Il giuramento #{id} è stato annullato da tutte le parti."
  complaint:
    not-party: "<red>Non sei parte di questo giuramento."
    not-allowed: "<red>Questo giuramento non può essere citato: è annullato o fuori dalla finestra di denuncia."
