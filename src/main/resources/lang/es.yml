# ServerRules - Español
prefix: "<dark_gray>[<green>ServerRules<dark_gray>] <reset>"

error:
  vault-missing: "Vault no está instalado. ServerRules requiere Vault."
  economy-missing: "No hay ningún proveedor de economía registrado en Vault. Instala EssentialsX y activa su economía."
  economy-not-essentials: "El proveedor de economía de Vault no es EssentialsX (encontrado: {provider}). ServerRules requiere EssentialsX."
  database: "Se ha producido un error interno de base de datos. Inténtalo de nuevo."
  invalid-amount: "El importe no es válido."
  invalid-duration: "La duración no es válida."
  fine-refused: "El plugin de economía rechazó el cargo (los saldos negativos pueden estar desactivados)."
  ban-failed: "No se pudo aplicar la prohibición."

rules:
  header: "<dark_gray>------- <green>Reglas del servidor <dark_gray>-------"
  footer: "<dark_gray>----------------------------"
  row: "<yellow>{number}. <white>{name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
  empty: "<gray>Aún no se ha definido ninguna regla."
  not-found: "<red>La regla {number} no existe."
  single-header: "<dark_gray>------- <green>Regla {number} <dark_gray>-------"
  sanction:
    fine: "<red>Multa: {amount}"
    temp-ban: "<red>Prohibición temporal: {duration}"
  changes:
    header: "<dark_gray>--- <green>Cambios de reglas desde tu última visita <dark_gray>---"
    added: "<green>[+] Regla {number}. {name}"
    modified: "<yellow>[~] Regla {number}. {name}"
    removed: "<red>[-] Regla {number}. {name}"
    none: "<gray>No hay cambios de reglas desde tu última visita."
    footer: "<gray>Escribe <white>{rules-command} <gray>para ver todas las reglas."
  admin:
    usage:
      add: "<gray>Uso: <white>{rules-command} add <nombre> <fine|ban> <valor> [descripción]"
      edit: "<gray>Uso: <white>{rules-command} edit <n°> <nombre> <fine|ban> <valor> [descripción]"
      remove: "<gray>Uso: <white>{rules-command} remove <n°>"
      move: "<gray>Uso: <white>{rules-command} move <n°> <posición>"
    pending-header: "<gold>Cambio pendiente:"
    pending-add: "<green>[+] Regla {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-edit: "<yellow>[~] Regla {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-remove: "<red>[-] Regla {number}. {name}"
    pending-note: "<gray>Confirma con <click:run_command:'{confirm}'><green>[Confirmar]</click> <gray>o cancela con <click:run_command:'{cancel}'><red>[Cancelar]</click> <gray>en {timeout} segundos."
    confirmed: "<green>El cambio se ha aplicado."
    cancelled: "<gray>El cambio pendiente se ha cancelado."
    nothing-pending: "<red>No hay ningún cambio pendiente que confirmar."
    pending-expired: "<red>Tu cambio pendiente ha caducado. Vuelve a empezar."
    moved: "<green>Regla movida: {number} -> {position}."
    invalid-position: "<red>Posición no válida: {position}."
    reloaded: "<green>Configuración, idiomas y reglas recargados."

complaint:
  usage: "<gray>Uso: <white>/plaint <jugador> <n° de regla> <detalles>"
  players-only: "<red>Solo un jugador puede presentar una denuncia."
  deposited: "<green>Tu denuncia #{id} se ha enviado a los jueces."
  cooldown: "<red>Espera {time} antes de presentar otra denuncia."
  rule-not-found: "<red>La regla {number} no existe."
  oath-invalid: "<red>La referencia de juramento {reference} no es válida. Usa oath:<n°>."
  player-not-found: "<red>El jugador {player} es desconocido."
  self: "<red>No puedes presentar una denuncia contra ti mismo."
  list:
    header: "<dark_gray>--- <green>Denuncias <dark_gray>---"
    empty: "<gray>No hay denuncias que mostrar."
    row: "<yellow>#{id} <gray>{plaintiff} <dark_gray>-> <gray>{accused} <dark_gray>| {citation} <dark_gray>| <gray>{date} <dark_gray>| {status}"
  detail:
    header: "<dark_gray>--- <green>Denuncia #{id} <dark_gray>---"
    plaintiff: "<gray>Denunciante: <white>{plaintiff}"
    accused: "<gray>Acusado: <white>{accused}"
    citation: "<gray>Citado: <white>{citation}"
    sanction: "<gray>Sanción prevista: {sanction}"
    details: "<gray>Detalles: <white>{details}"
    date: "<gray>Fecha: <white>{date}"
    status: "<gray>Estado: {status}"
  status:
    pending: "<yellow>pendiente"
    handled: "<green>tramitada"
    dismissed: "<gray>desestimada"
    sanction-to-execute: "<gold>sanción por ejecutar"

citation:
  rule: "<white>Regla {number} <gray>({name})"
  oath: "<white>Juramento #{id}"

judge:
  notify: "<gold>Nueva denuncia #{id} <gray>de <white>{plaintiff} <gray>contra <white>{accused}<gray>."
  pending-on-join: "<gold>{count} denuncia(s) esperando tu juicio."
  not-found: "<red>La denuncia #{id} no existe."
  conflict: "<red>Estás implicado en la denuncia #{id} y no puedes tramitarla."
  invalid-status: "<red>Estado desconocido. Usa: pending, handled, dismissed."
  superjudge-only: "<red>Solo un superjuez puede cambiar la regla citada."
  rule-changed: "<green>Denuncia #{id}: regla citada cambiada de <white>{old} <green>a <white>{new}<green>."
  sanction-applied: "<green>Denuncia #{id} tramitada: {sanction}"
  sanction-failed: "<red>No se pudo aplicar la sanción: {error}"
  out-of-range: "<red>Valor fuera de rango. Permitido: de {min} a {max}."
  invalid-value: "<red>Valor no válido."
  no-modulation: "<red>Esta citación no puede modularse."
  custom-manual: "<red>Es una sanción personalizada: no puede aplicarse automáticamente. Usa /judge done una vez ejecutada."
  custom-to-execute: "<gold>Denuncia #{id}: sanción personalizada. Ejecútala y luego marca la denuncia como tramitada."
  done-not-custom: "<red>Solo una sanción personalizada puede marcarse como tramitada."
  dismissed: "<gray>Denuncia #{id} desestimada sin más acciones."
  done: "<green>Denuncia #{id} marcada como tramitada."
  ban-reason: "Infracción de las reglas del servidor - {citation} (denuncia #{id})"

oath:
  usage:
    general: "<gray>Uso: <white>{oath-command} <create|join|accept|refuse|info|cancel>"
    create: "<gray>Uso: <white>{oath-command} create <duración> fine <cantidad> <promesa> <dark_gray>| <gray>{oath-command} create <duración> ban <duración-ban> <promesa> <dark_gray>| <gray>{oath-command} create <duración> custom \"<sanción>\" <promesa>"
    join: "<gray>Uso: <white>{oath-command} join <código>"
    info: "<gray>Uso: <white>{oath-command} info <n°>"
    cancel: "<gray>Uso: <white>{oath-command} cancel <n°>"
  players-only: "<red>Solo un jugador puede usar juramentos."
  not-found: "<red>El juramento #{id} no existe."
  status:
    proposed: "<yellow>propuesto"
    proposal-expired: "<gray>propuesta expirada"
    active: "<green>activo"
    expired: "<gray>expirado"
    cancelled: "<gray>anulado"
    broken: "<red>incumplido"
    handled: "<green>tratado"
  create:
    created: "<green>Juramento #{id} creado. Comparte el código para que otros se unan."
    code: "<gray>Código: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    code-validity: "<gray>El código es válido durante <white>{time}<gray>."
    invalid-duration: "<red>La duración del juramento no es válida."
    invalid-value: "<red>El valor de la sanción no es válido."
  recap:
    header: "<dark_gray>--- <green>Juramento #{id} <dark_gray>---"
    founder: "<gray>Fundador: <white>{founder}"
    parties: "<gray>Partes: <white>{parties}"
    promise: "<gray>Promesa: <white>{promise}"
    duration: "<gray>Duración: <white>{duration}"
    sanction: "<gray>Sanción en caso de incumplimiento: {sanction}"
    status: "<gray>Estado: {status}"
    code: "<gray>Código de unión: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
  join:
    prompt: "<gray>Acepta con <click:run_command:'{accept}'><green>[Aceptar]</click> <gray>o rechaza con <click:run_command:'{refuse}'><red>[Rechazar]</click>."
    lockout: "<red>Demasiados códigos incorrectos. Inténtalo de nuevo en {time}."
    invalid: "<red>Este código de juramento no es válido o ha expirado."
    already-member: "<red>Ya eres parte de este juramento."
    full: "<red>Este juramento ha alcanzado su número máximo de partes."
    none-pending: "<red>No tienes ninguna invitación de juramento pendiente."
    accepted: "<green>Te has unido al juramento #{id}."
    refused: "<gray>Has rechazado la invitación al juramento #{id}."
    joined-notify: "<green>{player} se ha unido a tu juramento #{id}."
    activated: "<green>El juramento #{id} ahora está activo con {count} partes."
  cancel:
    not-allowed: "<red>El juramento #{id} ya no se puede anular."
    not-party: "<red>No eres parte del juramento #{id}."
    requested: "<gold>Has solicitado la anulación del juramento #{id}. Las otras partes deben confirmar."
    confirm-request: "<gold>{player} quiere anular el juramento #{id}. <click:run_command:'{confirm}'><green>[Confirmar]</click>"
    already-requested: "<gray>Ya has solicitado la anulación del juramento #{id}. Esperando a las otras partes."
    confirmed: "<green>Has confirmado la anulación del juramento #{id}. Esperando a las otras partes."
    cancelled: "<gray>El juramento #{id} ha sido anulado por todas las partes."
  complaint:
    not-party: "<red>No eres parte de este juramento."
    not-allowed: "<red>Este juramento no se puede citar: está anulado o fuera del plazo de denuncia."
