# ServerRules - Español
prefix: "<dark_gray>[<green>ServerRules<dark_gray>] <reset>"

error:
  vault-missing: "Vault no está instalado. ServerRules requiere Vault."
  economy-missing: "No hay ningún proveedor de economía registrado en Vault. Instala EssentialsX y activa su economía."
  economy-not-essentials: "El proveedor de economía de Vault no es EssentialsX (encontrado: {provider}). ServerRules requiere EssentialsX."

rules:
  header: "<dark_gray>------- <green>Reglas del servidor <dark_gray>-------"
  footer: "<dark_gray>----------------------------"
  row: "<yellow>{number}. <white>{name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
  empty: "<gray>Aún no se ha definido ninguna regla."
  not-found: "<red>La regla {number} no existe."
  single-header: "<dark_gray>------- <green>Regla {number} <dark_gray>-------"
  sanction:
    fine: "<red>Multa: {amount}"
    temp-ban: "<red>Prohibición temporal: {duration}"
  changes:
    header: "<dark_gray>--- <green>Cambios de reglas desde tu última visita <dark_gray>---"
    added: "<green>[+] Regla {number}. {name}"
    modified: "<yellow>[~] Regla {number}. {name}"
    removed: "<red>[-] Regla {number}. {name}"
    none: "<gray>No hay cambios de reglas desde tu última visita."
    footer: "<gray>Escribe <white>{rules-command} <gray>para ver todas las reglas."
