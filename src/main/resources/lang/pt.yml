# ServerRules - Português
prefix: "<dark_gray>[<green>ServerRules<dark_gray>] <reset>"

error:
  vault-missing: "O Vault não está instalado. O ServerRules requer o Vault."
  economy-missing: "Nenhum provedor de economia está registrado no Vault. Instale o EssentialsX e ative sua economia."
  economy-not-essentials: "O provedor de economia do Vault não é o EssentialsX (encontrado: {provider}). O ServerRules requer o EssentialsX."
  database: "Ocorreu um erro interno na base de dados. Tente novamente."
  invalid-amount: "O montante é inválido."
  invalid-duration: "A duração é inválida."
  fine-refused: "O plugin de economia recusou o levantamento (os saldos negativos podem estar desativados)."
  ban-failed: "O banimento não pôde ser aplicado."

rules:
  header: "<dark_gray>------- <green>Regras do servidor <dark_gray>-------"
  footer: "<dark_gray>----------------------------"
  row: "<yellow>{number}. <white>{name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
  empty: "<gray>Nenhuma regra foi definida ainda."
  not-found: "<red>A regra {number} não existe."
  single-header: "<dark_gray>------- <green>Regra {number} <dark_gray>-------"
  sanction:
    fine: "<red>Multa: {amount}"
    temp-ban: "<red>Banimento temporário: {duration}"
  changes:
    header: "<dark_gray>--- <green>Alterações de regras desde a sua última visita <dark_gray>---"
    added: "<green>[+] Regra {number}. {name}"
    modified: "<yellow>[~] Regra {number}. {name}"
    removed: "<red>[-] Regra {number}. {name}"
    none: "<gray>Nenhuma alteração de regra desde a sua última visita."
    footer: "<gray>Digite <white>{rules-command} <gray>para ver todas as regras."
  admin:
    usage:
      add: "<gray>Utilização: <white>{rules-command} add <nome> <fine|ban> <valor> [descrição]"
      edit: "<gray>Utilização: <white>{rules-command} edit <n.º> <nome> <fine|ban> <valor> [descrição]"
      remove: "<gray>Utilização: <white>{rules-command} remove <n.º>"
      move: "<gray>Utilização: <white>{rules-command} move <n.º> <posição>"
    pending-header: "<gold>Alteração pendente:"
    pending-add: "<green>[+] Regra {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-edit: "<yellow>[~] Regra {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-remove: "<red>[-] Regra {number}. {name}"
    pending-note: "<gray>Confirme com <click:run_command:'{confirm}'><green>[Confirmar]</click> <gray>ou cancele com <click:run_command:'{cancel}'><red>[Cancelar]</click> <gray>dentro de {timeout} segundos."
    confirmed: "<green>A alteração foi aplicada."
    cancelled: "<gray>A alteração pendente foi cancelada."
    nothing-pending: "<red>Não há nenhuma alteração pendente para confirmar."
    pending-expired: "<red>A sua alteração pendente expirou. Comece de novo."
    moved: "<green>Regra movida: {number} -> {position}."
    invalid-position: "<red>Posição inválida: {position}."
    reloaded: "<green>Configuração, idiomas e regras recarregados."

complaint:
  usage: "<gray>Utilização: <white>/plaint <jogador> <n.º de regra> <detalhes>"
  players-only: "<red>Apenas um jogador pode apresentar uma queixa."
  deposited: "<green>A sua queixa #{id} foi enviada aos juízes."
  cooldown: "<red>Aguarde {time} antes de apresentar outra queixa."
  rule-not-found: "<red>A regra {number} não existe."
  oath-invalid: "<red>A referência de juramento {reference} é inválida. Use oath:<id>."
  player-not-found: "<red>O jogador {player} é desconhecido."
  self: "<red>Não pode apresentar uma queixa contra si mesmo."
  list:
    header: "<dark_gray>--- <green>Queixas <dark_gray>---"
    empty: "<gray>Nenhuma queixa para exibir."
    row: "<yellow>#{id} <gray>{plaintiff} <dark_gray>-> <gray>{accused} <dark_gray>| {citation} <dark_gray>| <gray>{date} <dark_gray>| {status}"
  detail:
    header: "<dark_gray>--- <green>Queixa #{id} <dark_gray>---"
    plaintiff: "<gray>Queixoso: <white>{plaintiff}"
    accused: "<gray>Acusado: <white>{accused}"
    citation: "<gray>Citado: <white>{citation}"
    sanction: "<gray>Sanção prevista: {sanction}"
    details: "<gray>Detalhes: <white>{details}"
    date: "<gray>Data: <white>{date}"
    status: "<gray>Estado: {status}"
  status:
    pending: "<yellow>pendente"
    handled: "<green>tratada"
    dismissed: "<gray>arquivada"
    sanction-to-execute: "<gold>sanção a executar"

citation:
  rule: "<white>Regra {number} <gray>({name})"
  oath: "<white>Juramento #{id}"

judge:
  notify: "<gold>Nova queixa #{id} <gray>de <white>{plaintiff} <gray>contra <white>{accused}<gray>."
  pending-on-join: "<gold>{count} queixa(s) à espera do seu julgamento."
  not-found: "<red>A queixa #{id} não existe."
  conflict: "<red>Está envolvido na queixa #{id} e não pode tratá-la."
  invalid-status: "<red>Estado desconhecido. Use: pending, handled, dismissed."
  superjudge-only: "<red>Apenas um superjuiz pode alterar a regra citada."
  rule-changed: "<green>Queixa #{id}: regra citada alterada de <white>{old} <green>para <white>{new}<green>."
  sanction-applied: "<green>Queixa #{id} tratada: {sanction}"
  sanction-failed: "<red>A sanção não pôde ser aplicada: {error}"
  out-of-range: "<red>Valor fora do intervalo. Permitido: {min} a {max}."
  invalid-value: "<red>Valor inválido."
  no-modulation: "<red>Esta citação não pode ser modulada."
  custom-manual: "<red>Esta é uma sanção personalizada: não pode ser aplicada automaticamente. Use /judge done após a execução."
  custom-to-execute: "<gold>Queixa #{id}: sanção personalizada. Execute-a e depois marque a queixa como concluída."
  done-not-custom: "<red>Apenas uma sanção personalizada pode ser marcada como concluída."
  dismissed: "<gray>Queixa #{id} arquivada sem mais ações."
  done: "<green>Queixa #{id} marcada como concluída."
  ban-reason: "Violação das regras do servidor - {citation} (queixa #{id})"

oath:
  usage:
    general: "<gray>Utilização: <white>{oath-command} <create|join|accept|refuse|info|cancel>"
    create: "<gray>Utilização: <white>{oath-command} create <duração> fine <montante> <promessa> <dark_gray>| <gray>{oath-command} create <duração> ban <duração-ban> <promessa> <dark_gray>| <gray>{oath-command} create <duração> custom \"<sanção>\" <promessa>"
    join: "<gray>Utilização: <white>{oath-command} join <código>"
    info: "<gray>Utilização: <white>{oath-command} info <id>"
    cancel: "<gray>Utilização: <white>{oath-command} cancel <id>"
  players-only: "<red>Apenas um jogador pode usar juramentos."
  not-found: "<red>O juramento #{id} não existe."
  status:
    proposed: "<yellow>proposto"
    proposal-expired: "<gray>proposta expirada"
    active: "<green>ativo"
    expired: "<gray>expirado"
    cancelled: "<gray>cancelado"
    broken: "<red>quebrado"
    handled: "<green>tratado"
  create:
    created: "<green>Juramento #{id} criado. Partilhe o código para que outros possam aderir."
    code: "<gray>Código: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    code-validity: "<gray>O código é válido durante <white>{time}<gray>."
    invalid-duration: "<red>A duração do juramento é inválida."
    invalid-value: "<red>O valor da sanção é inválido."
  recap:
    header: "<dark_gray>--- <green>Juramento #{id} <dark_gray>---"
    founder: "<gray>Fundador: <white>{founder}"
    parties: "<gray>Partes: <white>{parties}"
    promise: "<gray>Promessa: <white>{promise}"
    duration: "<gray>Duração: <white>{duration}"
    sanction: "<gray>Sanção em caso de quebra: {sanction}"
    status: "<gray>Estado: {status}"
    code: "<gray>Código de adesão: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
  join:
    prompt: "<gray>Aceite com <click:run_command:'{accept}'><green>[Aceitar]</click> <gray>ou recuse com <click:run_command:'{refuse}'><red>[Recusar]</click>."
    lockout: "<red>Demasiados códigos inválidos. Tente novamente em {time}."
    invalid: "<red>Este código de juramento é inválido ou expirou."
    already-member: "<red>Já é parte deste juramento."
    full: "<red>Este juramento atingiu o número máximo de partes."
    none-pending: "<red>Não tem nenhum convite de juramento pendente."
    accepted: "<green>Aderiu ao juramento #{id}."
    refused: "<gray>Recusou o convite ao juramento #{id}."
    joined-notify: "<green>{player} aderiu ao seu juramento #{id}."
    activated: "<green>O juramento #{id} está agora ativo com {count} partes."
  cancel:
    not-allowed: "<red>O juramento #{id} já não pode ser cancelado."
    not-party: "<red>Não é parte do juramento #{id}."
    requested: "<gold>Pediu o cancelamento do juramento #{id}. As outras partes têm de confirmar."
    confirm-request: "<gold>{player} quer cancelar o juramento #{id}. <click:run_command:'{confirm}'><green>[Confirmar]</click>"
    already-requested: "<gray>Já pediu o cancelamento do juramento #{id}. A aguardar as outras partes."
    confirmed: "<green>Confirmou o cancelamento do juramento #{id}. A aguardar as outras partes."
    cancelled: "<gray>O juramento #{id} foi cancelado por todas as partes."
  complaint:
    not-party: "<red>Não é parte deste juramento."
    not-allowed: "<red>Este juramento não pode ser citado: está cancelado ou fora do prazo de queixa."
