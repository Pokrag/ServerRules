# ServerRules - Polski
prefix: "<dark_gray>[<green>ServerRules<dark_gray>] <reset>"

error:
  vault-missing: "Vault nie jest zainstalowany. ServerRules wymaga Vault."
  economy-missing: "Żaden dostawca ekonomii nie jest zarejestrowany w Vault. Zainstaluj EssentialsX i włącz jego ekonomię."
  economy-not-essentials: "Dostawca ekonomii Vault to nie EssentialsX (znaleziono: {provider}). ServerRules wymaga EssentialsX."
  database: "Wystąpił wewnętrzny błąd bazy danych. Spróbuj ponownie."
  invalid-amount: "Kwota jest nieprawidłowa."
  invalid-duration: "Czas trwania jest nieprawidłowy."
  fine-refused: "Plugin ekonomii odmówił pobrania środków (ujemne salda mogą być wyłączone)."
  ban-failed: "Nie udało się zastosować blokady."

rules:
  header: "<dark_gray>------- <green>Zasady serwera <dark_gray>-------"
  footer: "<dark_gray>----------------------------"
  row: "<yellow>{number}. <white>{name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
  empty: "<gray>Nie zdefiniowano jeszcze żadnych zasad."
  not-found: "<red>Zasada {number} nie istnieje."
  single-header: "<dark_gray>------- <green>Zasada {number} <dark_gray>-------"
  sanction:
    fine: "<red>Grzywna: {amount}"
    temp-ban: "<red>Tymczasowa blokada: {duration}"
  changes:
    header: "<dark_gray>--- <green>Zmiany zasad od twojej ostatniej wizyty <dark_gray>---"
    added: "<green>[+] Zasada {number}. {name}"
    modified: "<yellow>[~] Zasada {number}. {name}"
    removed: "<red>[-] Zasada {number}. {name}"
    none: "<gray>Brak zmian zasad od twojej ostatniej wizyty."
    footer: "<gray>Wpisz <white>{rules-command} <gray>, aby zobaczyć wszystkie zasady."
  admin:
    usage:
      add: "<gray>Użycie: <white>{rules-command} add <nazwa> <fine|ban> <wartość> [opis]"
      edit: "<gray>Użycie: <white>{rules-command} edit <nr> <nazwa> <fine|ban> <wartość> [opis]"
      remove: "<gray>Użycie: <white>{rules-command} remove <nr>"
      move: "<gray>Użycie: <white>{rules-command} move <nr> <pozycja>"
    pending-header: "<gold>Oczekująca zmiana:"
    pending-add: "<green>[+] Zasada {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-edit: "<yellow>[~] Zasada {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-remove: "<red>[-] Zasada {number}. {name}"
    pending-note: "<gray>Potwierdź za pomocą <click:run_command:'{confirm}'><green>[Potwierdź]</click> <gray>lub anuluj za pomocą <click:run_command:'{cancel}'><red>[Anuluj]</click> <gray>w ciągu {timeout} sekund."
    confirmed: "<green>Zmiana została zastosowana."
    cancelled: "<gray>Oczekująca zmiana została anulowana."
    nothing-pending: "<red>Brak oczekującej zmiany do potwierdzenia."
    pending-expired: "<red>Twoja oczekująca zmiana wygasła. Zacznij od nowa."
    moved: "<green>Zasada przeniesiona: {number} -> {position}."
    invalid-position: "<red>Nieprawidłowa pozycja: {position}."
    reloaded: "<green>Konfiguracja, języki i zasady zostały przeładowane."

complaint:
  usage: "<gray>Użycie: <white>/plaint <gracz> <numer zasady> <szczegóły>"
  players-only: "<red>Tylko gracz może złożyć skargę."
  deposited: "<green>Twoja skarga #{id} została wysłana do sędziów."
  cooldown: "<red>Poczekaj {time}, zanim złożysz kolejną skargę."
  rule-not-found: "<red>Zasada {number} nie istnieje."
  oath-invalid: "<red>Odwołanie do przysięgi {reference} jest nieprawidłowe. Użyj oath:<id>."
  player-not-found: "<red>Gracz {player} jest nieznany."
  self: "<red>Nie możesz złożyć skargi na samego siebie."
  list:
    header: "<dark_gray>--- <green>Skargi <dark_gray>---"
    empty: "<gray>Brak skarg do wyświetlenia."
    row: "<yellow>#{id} <gray>{plaintiff} <dark_gray>-> <gray>{accused} <dark_gray>| {citation} <dark_gray>| <gray>{date} <dark_gray>| {status}"
  detail:
    header: "<dark_gray>--- <green>Skarga #{id} <dark_gray>---"
    plaintiff: "<gray>Składający: <white>{plaintiff}"
    accused: "<gray>Oskarżony: <white>{accused}"
    citation: "<gray>Cytowane: <white>{citation}"
    sanction: "<gray>Planowana sankcja: {sanction}"
    details: "<gray>Szczegóły: <white>{details}"
    date: "<gray>Data: <white>{date}"
    status: "<gray>Status: {status}"
  status:
    pending: "<yellow>oczekująca"
    handled: "<green>rozpatrzona"
    dismissed: "<gray>oddalona"
    sanction-to-execute: "<gold>sankcja do wykonania"

citation:
  rule: "<white>Zasada {number} <gray>({name})"
  oath: "<white>Przysięga #{id}"

judge:
  notify: "<gold>Nowa skarga #{id} <gray>od <white>{plaintiff} <gray>przeciwko <white>{accused}<gray>."
  pending-on-join: "<gold>{count} skarga/skargi oczekujące na twój wyrok."
  not-found: "<red>Skarga #{id} nie istnieje."
  conflict: "<red>Jesteś zamieszany w skargę #{id} i nie możesz jej rozpatrzyć."
  invalid-status: "<red>Nieznany status. Użyj: pending, handled, dismissed."
  superjudge-only: "<red>Tylko supersędzia może zmienić cytowaną zasadę."
  rule-changed: "<green>Skarga #{id}: cytowana zasada zmieniona z <white>{old} <green>na <white>{new}<green>."
  sanction-applied: "<green>Skarga #{id} rozpatrzona: {sanction}"
  sanction-failed: "<red>Nie udało się zastosować sankcji: {error}"
  out-of-range: "<red>Wartość poza zakresem. Dozwolone: od {min} do {max}."
  invalid-value: "<red>Nieprawidłowa wartość."
  no-modulation: "<red>Tej cytacji nie można modulować."
  custom-manual: "<red>To sankcja niestandardowa: nie można jej zastosować automatycznie. Użyj /judge done po wykonaniu."
  custom-to-execute: "<gold>Skarga #{id}: sankcja niestandardowa. Wykonaj ją, a następnie oznacz skargę jako zakończoną."
  done-not-custom: "<red>Tylko sankcję niestandardową można oznaczyć jako zakończoną."
  dismissed: "<gray>Skarga #{id} oddalona bez dalszych działań."
  done: "<green>Skarga #{id} oznaczona jako zakończona."
  ban-reason: "Naruszenie zasad serwera - {citation} (skarga #{id})"

oath:
  usage:
    general: "<gray>Użycie: <white>{oath-command} <create|join|accept|refuse|info|cancel>"
    create: "<gray>Użycie: <white>{oath-command} create <czas trwania> fine <kwota> <obietnica> <dark_gray>| <gray>{oath-command} create <czas trwania> ban <czas bana> <obietnica> <dark_gray>| <gray>{oath-command} create <czas trwania> custom \"<sankcja>\" <obietnica>"
    join: "<gray>Użycie: <white>{oath-command} join <kod>"
    info: "<gray>Użycie: <white>{oath-command} info <id>"
    cancel: "<gray>Użycie: <white>{oath-command} cancel <id>"
  players-only: "<red>Tylko gracz może używać przysiąg."
  not-found: "<red>Przysięga #{id} nie istnieje."
  status:
    proposed: "<yellow>zaproponowana"
    proposal-expired: "<gray>propozycja wygasła"
    active: "<green>aktywna"
    expired: "<gray>wygasła"
    cancelled: "<gray>anulowana"
    broken: "<red>złamana"
    handled: "<green>rozpatrzona"
  create:
    created: "<green>Przysięga #{id} utworzona. Udostępnij kod, aby inni mogli dołączyć."
    code: "<gray>Kod: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    code-validity: "<gray>Kod jest ważny przez <white>{time}<gray>."
    invalid-duration: "<red>Czas trwania przysięgi jest nieprawidłowy."
    invalid-value: "<red>Wartość sankcji jest nieprawidłowa."
  recap:
    header: "<dark_gray>--- <green>Przysięga #{id} <dark_gray>---"
    founder: "<gray>Założyciel: <white>{founder}"
    parties: "<gray>Strony: <white>{parties}"
    promise: "<gray>Obietnica: <white>{promise}"
    duration: "<gray>Czas trwania: <white>{duration}"
    sanction: "<gray>Sankcja w przypadku złamania: {sanction}"
    status: "<gray>Status: {status}"
    code: "<gray>Kod dołączenia: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
  join:
    prompt: "<gray>Zaakceptuj za pomocą <click:run_command:'{accept}'><green>[Akceptuj]</click> <gray>lub odrzuć za pomocą <click:run_command:'{refuse}'><red>[Odrzuć]</click>."
    lockout: "<red>Zbyt wiele nieprawidłowych kodów. Spróbuj ponownie za {time}."
    invalid: "<red>Ten kod przysięgi jest nieprawidłowy lub wygasł."
    already-member: "<red>Jesteś już stroną tej przysięgi."
    full: "<red>Ta przysięga osiągnęła maksymalną liczbę stron."
    none-pending: "<red>Nie masz żadnego oczekującego zaproszenia do przysięgi."
    accepted: "<green>Dołączyłeś do przysięgi #{id}."
    refused: "<gray>Odrzuciłeś zaproszenie do przysięgi #{id}."
    joined-notify: "<green>{player} dołączył do twojej przysięgi #{id}."
    activated: "<green>Przysięga #{id} jest teraz aktywna z {count} stronami."
  cancel:
    not-allowed: "<red>Przysięga #{id} nie może być już anulowana."
    not-party: "<red>Nie jesteś stroną przysięgi #{id}."
    requested: "<gold>Poprosiłeś o anulowanie przysięgi #{id}. Pozostałe strony muszą potwierdzić."
    confirm-request: "<gold>{player} chce anulować przysięgę #{id}. <click:run_command:'{confirm}'><green>[Potwierdź]</click>"
    already-requested: "<gray>Już poprosiłeś o anulowanie przysięgi #{id}. Oczekiwanie na pozostałe strony."
    confirmed: "<green>Potwierdziłeś anulowanie przysięgi #{id}. Oczekiwanie na pozostałe strony."
    cancelled: "<gray>Przysięga #{id} została anulowana przez wszystkie strony."
  complaint:
    not-party: "<red>Nie jesteś stroną tej przysięgi."
    not-allowed: "<red>Ta przysięga nie może być cytowana: jest anulowana lub poza oknem skargi."

