    full: "<red>Bu yemin maksimum taraf sayısına ulaştı."
    none-pending: "<red>Bekleyen bir yemin davetiniz yok."
    accepted: "<green>#{id} numaralı yemine katıldınız."
    refused: "<gray>#{id} numaralı yemin davetini reddettiniz."
    joined-notify: "<green>{player}, #{id} numaralı yemininize katıldı."
    activated: "<green>Yemin #{id} artık {count} tarafla etkin."
  cancel:
    not-allowed: "<red>Yemin #{id} artık iptal edilemez."
    not-party: "<red>#{id} numaralı yeminin bir tarafı değilsiniz."
