# ServerRules - Türkçe
prefix: "<dark_gray>[<green>ServerRules<dark_gray>] <reset>"

error:
  vault-missing: "Vault kurulu değil. ServerRules, Vault gerektirir."
  economy-missing: "Vault'a kayıtlı bir ekonomi sağlayıcısı yok. EssentialsX'i kurun ve ekonomisini etkinleştirin."
  economy-not-essentials: "Vault ekonomi sağlayıcısı EssentialsX değil (bulunan: {provider}). ServerRules, EssentialsX gerektirir."
  database: "Dahili bir veritabanı hatası oluştu. Lütfen tekrar deneyin."
  invalid-amount: "Miktar geçersiz."
  invalid-duration: "Süre geçersiz."
  fine-refused: "Ekonomi eklentisi para çekme işlemini reddetti (negatif bakiyeler devre dışı olabilir)."
  ban-failed: "Ban uygulanamadı."

rules:
  header: "<dark_gray>------- <green>Sunucu kuralları <dark_gray>-------"
  footer: "<dark_gray>----------------------------"
  row: "<yellow>{number}. <white>{name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
  empty: "<gray>Henüz hiçbir kural tanımlanmadı."
  not-found: "<red>{number} numaralı kural yok."
  single-header: "<dark_gray>------- <green>Kural {number} <dark_gray>-------"
  sanction:
    fine: "<red>Para cezası: {amount}"
    temp-ban: "<red>Geçici ban: {duration}"
  changes:
    header: "<dark_gray>--- <green>Son ziyaretinizden beri kural değişiklikleri <dark_gray>---"
    added: "<green>[+] Kural {number}. {name}"
    modified: "<yellow>[~] Kural {number}. {name}"
    removed: "<red>[-] Kural {number}. {name}"
    none: "<gray>Son ziyaretinizden beri kural değişikliği yok."
    footer: "<gray>Tüm kuralları görmek için <white>{rules-command} <gray>yazın."
  admin:
    usage:
      add: "<gray>Kullanım: <white>{rules-command} add <ad> <fine|ban> <değer> [açıklama]"
      edit: "<gray>Kullanım: <white>{rules-command} edit <no> <ad> <fine|ban> <değer> [açıklama]"
      remove: "<gray>Kullanım: <white>{rules-command} remove <no>"
      move: "<gray>Kullanım: <white>{rules-command} move <no> <konum>"
    pending-header: "<gold>Bekleyen değişiklik:"
    pending-add: "<green>[+] Kural {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-edit: "<yellow>[~] Kural {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-remove: "<red>[-] Kural {number}. {name}"
    pending-note: "<gray><click:run_command:'{confirm}'><green>[Onayla]</click> <gray>ile onaylayın veya <click:run_command:'{cancel}'><red>[İptal]</click> <gray>ile {timeout} saniye içinde iptal edin."
    confirmed: "<green>Değişiklik uygulandı."
    cancelled: "<gray>Bekleyen değişiklik iptal edildi."
    nothing-pending: "<red>Onaylanacak bekleyen bir değişiklik yok."
    pending-expired: "<red>Bekleyen değişikliğinizin süresi doldu. Lütfen baştan başlayın."
    moved: "<green>Kural taşındı: {number} -> {position}."
    invalid-position: "<red>Geçersiz konum: {position}."
    reloaded: "<green>Yapılandırma, diller ve kurallar yeniden yüklendi."

complaint:
  usage: "<gray>Kullanım: <white>/plaint <oyuncu> <kural numarası> <ayrıntılar>"
  players-only: "<red>Yalnızca bir oyuncu şikayet edebilir."
  deposited: "<green>#{id} numaralı şikayetiniz hakemlere gönderildi."
  cooldown: "<red>Yeni bir şikayet göndermeden önce {time} bekleyin."
  rule-not-found: "<red>{number} numaralı kural yok."
  oath-invalid: "<red>Yemin referansı {reference} geçersiz. oath:<no> kullanın."
  player-not-found: "<red>{player} oyuncusu bilinmiyor."
  self: "<red>Kendiniz hakkında şikayet edemezsiniz."
  list:
    header: "<dark_gray>--- <green>Şikayetler <dark_gray>---"
    empty: "<gray>Gösterilecek şikayet yok."
    row: "<yellow>#{id} <gray>{plaintiff} <dark_gray>-> <gray>{accused} <dark_gray>| {citation} <dark_gray>| <gray>{date} <dark_gray>| {status}"
  detail:
    header: "<dark_gray>--- <green>Şikayet #{id} <dark_gray>---"
    plaintiff: "<gray>Şikayetçi: <white>{plaintiff}"
    accused: "<gray>Sanık: <white>{accused}"
    citation: "<gray>Atıfta bulunulan: <white>{citation}"
    sanction: "<gray>Planlanan yaptırım: {sanction}"
    details: "<gray>Ayrıntılar: <white>{details}"
    date: "<gray>Tarih: <white>{date}"
    status: "<gray>Durum: {status}"
  status:
    pending: "<yellow>beklemede"
    handled: "<green>işlendi"
    dismissed: "<gray>reddedildi"
    sanction-to-execute: "<gold>uygulanacak yaptırım"

citation:
  rule: "<white>{number} numaralı kural <gray>({name})"
  oath: "<white>Yemin #{id}"

judge:
  notify: "<gold>Yeni şikayet #{id} <gray><white>{plaintiff} <gray>tarafından <white>{accused}<gray> hakkında."
  pending-on-join: "<gold>Yargılamanızı bekleyen {count} şikayet var."
  not-found: "<red>#{id} numaralı şikayet mevcut değil."
  conflict: "<red>#{id} numaralı şikayete dahilsiniz ve onu ele alamazsınız."
  invalid-status: "<red>Bilinmeyen durum. Şunları kullanın: pending, handled, dismissed."
  superjudge-only: "<red>Atıfta bulunulan kuralı yalnızca bir baş hakem değiştirebilir."
  rule-changed: "<green>#{id} numaralı şikayet: atıfta bulunulan kural <white>{old} <green>değerinden <white>{new}<green> değerine değiştirildi."
  sanction-applied: "<green>#{id} numaralı şikayet işlendi: {sanction}"
  sanction-failed: "<red>Yaptırım uygulanamadı: {error}"
  out-of-range: "<red>Değer aralık dışında. İzin verilen: {min} ile {max} arası."
  invalid-value: "<red>Geçersiz değer."
  no-modulation: "<red>Bu atıf değiştirilemez."
  custom-manual: "<red>Bu özel bir yaptırımdır: otomatik olarak uygulanamaz. Uygulandıktan sonra /judge done kullanın."
  custom-to-execute: "<gold>#{id} numaralı şikayet: özel yaptırım. Uygulayın, ardından şikayeti tamamlandı olarak işaretleyin."
  done-not-custom: "<red>Yalnızca özel bir yaptırım tamamlandı olarak işaretlenebilir."
  dismissed: "<gray>#{id} numaralı şikayet başka işlem yapılmadan reddedildi."
  done: "<green>#{id} numaralı şikayet tamamlandı olarak işaretlendi."
  ban-reason: "Sunucu kuralları ihlali - {citation} (#{id} numaralı şikayet)"

oath:
  usage:
    general: "<gray>Kullanım: <white>{oath-command} <create|join|accept|refuse|info|cancel>"
    create: "<gray>Kullanım: <white>{oath-command} create <süre> fine <miktar> <söz> <dark_gray>| <gray>{oath-command} create <süre> ban <ban-süresi> <söz> <dark_gray>| <gray>{oath-command} create <süre> custom \"<yaptırım>\" <söz>"
    join: "<gray>Kullanım: <white>{oath-command} join <kod>"
    info: "<gray>Kullanım: <white>{oath-command} info <no>"
    cancel: "<gray>Kullanım: <white>{oath-command} cancel <no>"
  players-only: "<red>Yeminleri yalnızca bir oyuncu kullanabilir."
  not-found: "<red>Yemin #{id} mevcut değil."
  status:
    proposed: "<yellow>teklif edildi"
    proposal-expired: "<gray>teklifin süresi doldu"
    active: "<green>etkin"
    expired: "<gray>süresi doldu"
    cancelled: "<gray>iptal edildi"
    broken: "<red>bozuldu"
    handled: "<green>işlendi"
  create:
    created: "<green>Yemin #{id} oluşturuldu. Başkalarının katılabilmesi için kodu paylaşın."
    code: "<gray>Kod: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    code-validity: "<gray>Kod <white>{time}<gray> boyunca geçerlidir."
    invalid-duration: "<red>Yemin süresi geçersiz."
    invalid-value: "<red>Yaptırım değeri geçersiz."
  recap:
    header: "<dark_gray>--- <green>Yemin #{id} <dark_gray>---"
    founder: "<gray>Kurucu: <white>{founder}"
    parties: "<gray>Taraflar: <white>{parties}"
    promise: "<gray>Söz: <white>{promise}"
    duration: "<gray>Süre: <white>{duration}"
    sanction: "<gray>Bozulursa yaptırım: {sanction}"
    status: "<gray>Durum: {status}"
    code: "<gray>Katılım kodu: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
  join:
    prompt: "<gray>Kabul etmek için <click:run_command:'{accept}'><green>[Kabul Et]</click> <gray>veya reddetmek için <click:run_command:'{refuse}'><red>[Reddet]</click> <gray>tıklayın."
    lockout: "<red>Çok fazla geçersiz kod. {time} sonra tekrar deneyin."
    invalid: "<red>Bu yemin kodu geçersiz veya süresi dolmuş."
    already-member: "<red>Bu yeminin zaten bir tarafısınız."
    full: "<red>Bu yemin maksimum taraf sayısına ulaştı."
    none-pending: "<red>Bekleyen bir yemin davetiniz yok."
    accepted: "<green>#{id} numaralı yemine katıldınız."
    refused: "<gray>#{id} numaralı yemin davetini reddettiniz."
    joined-notify: "<green>{player}, #{id} numaralı yemininize katıldı."
    activated: "<green>Yemin #{id} artık {count} tarafla etkin."
  cancel:
    not-allowed: "<red>Yemin #{id} artık iptal edilemez."
    not-party: "<red>#{id} numaralı yeminin bir tarafı değilsiniz."
    requested: "<gold>#{id} numaralı yeminin iptalini talep ettiniz. Diğer taraflar onaylamalı."
    confirm-request: "<gold>{player}, #{id} numaralı yemini iptal etmek istiyor. <click:run_command:'{confirm}'><green>[Onayla]</click>"
    already-requested: "<gray>#{id} numaralı yeminin iptalini zaten talep ettiniz. Diğer taraflar bekleniyor."
    confirmed: "<green>#{id} numaralı yeminin iptalini onayladınız. Diğer taraflar bekleniyor."
    cancelled: "<gray>Yemin #{id} tüm taraflarca iptal edildi."
  complaint:
    not-party: "<red>Bu yeminin bir tarafı değilsiniz."
    not-allowed: "<red>Bu yemine atıfta bulunulamaz: iptal edildi veya şikayet süresinin dışında."
