    code: "<gray>Kod: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    code-validity: "<gray>Kod <white>{time}<gray> boyunca geçerlidir."
    invalid-duration: "<red>Yemin süresi geçersiz."
    invalid-value: "<red>Yaptırım değeri geçersiz."
  recap:
    header: "<dark_gray>--- <green>Yemin #{id} <dark_gray>---"
    founder: "<gray>Kurucu: <white>{founder}"
    parties: "<gray>Taraflar: <white>{parties}"
    promise: "<gray>Söz: <white>{promise}"
    duration: "<gray>Süre: <white>{duration}"
    sanction: "<gray>Bozulursa yaptırım: {sanction}"
    status: "<gray>Durum: {status}"
    code: "<gray>Katılım kodu: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
  join:
    prompt: "<gray>Kabul etmek için <click:run_command:'{accept}'><green>[Kabul Et]</click> <gray>veya reddetmek için <click:run_command:'{refuse}'><red>[Reddet]</click> <gray>tıklayın."
