# ServerRules - English (reference language)
prefix: "<dark_gray>[<green>ServerRules<dark_gray>] <reset>"

error:
  vault-missing: "Vault is not installed. ServerRules requires Vault."
  economy-missing: "No economy provider is registered with Vault. Install EssentialsX and enable its economy."
  economy-not-essentials: "The Vault economy provider is not EssentialsX (found: {provider}). ServerRules requires EssentialsX."
  database: "An internal database error occurred. Please try again."
  invalid-amount: "The amount is invalid."
  invalid-duration: "The duration is invalid."
  fine-refused: "The economy plugin refused the withdrawal (negative balances may be disabled)."
  ban-failed: "The ban could not be applied."

rules:
  header: "<dark_gray>------- <green>Server rules <dark_gray>-------"
  footer: "<dark_gray>----------------------------"
  row: "<yellow>{number}. <white>{name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
  empty: "<gray>No rules have been defined yet."
  not-found: "<red>Rule {number} does not exist."
  single-header: "<dark_gray>------- <green>Rule {number} <dark_gray>-------"
  sanction:
    fine: "<red>Fine: {amount}"
    temp-ban: "<red>Temporary ban: {duration}"
  changes:
    header: "<dark_gray>--- <green>Rule changes since your last visit <dark_gray>---"
    added: "<green>[+] Rule {number}. {name}"
    modified: "<yellow>[~] Rule {number}. {name}"
    removed: "<red>[-] Rule {number}. {name}"
    none: "<gray>No rule changes since your last visit."
    footer: "<gray>Type <white>{rules-command} <gray>to see all rules."
  admin:
    usage:
      add: "<gray>Usage: <white>{rules-command} add <name> <fine|ban> <value> [description]"
      edit: "<gray>Usage: <white>{rules-command} edit <rule> <name> <fine|ban> <value> [description]"
      remove: "<gray>Usage: <white>{rules-command} remove <rule>"
      move: "<gray>Usage: <white>{rules-command} move <rule> <position>"
    pending-header: "<gold>Pending change:"
    pending-add: "<green>[+] Rule {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-edit: "<yellow>[~] Rule {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-remove: "<red>[-] Rule {number}. {name}"
    pending-note: "<gray>Confirm with <click:run_command:'{confirm}'><green>[Confirm]</click> <gray>or cancel with <click:run_command:'{cancel}'><red>[Cancel]</click> <gray>within {timeout} seconds."
    confirmed: "<green>The change has been applied."
    cancelled: "<gray>The pending change has been cancelled."
    nothing-pending: "<red>There is no pending change to confirm."
    pending-expired: "<red>Your pending change has expired. Please start again."
    moved: "<green>Rule moved: {number} -> {position}."
    invalid-position: "<red>Invalid position: {position}."
    reloaded: "<green>Configuration, languages and rules reloaded."

complaint:
  usage: "<gray>Usage: <white>/plaint <player> <rule number> <details>"
  players-only: "<red>Only a player can file a complaint."
  deposited: "<green>Your complaint #{id} has been sent to the judges."
  cooldown: "<red>Please wait {time} before filing another complaint."
  rule-not-found: "<red>Rule {number} does not exist."
  oath-invalid: "<red>The oath reference {reference} is invalid. Use oath:<id>."
  player-not-found: "<red>Player {player} is unknown."
  self: "<red>You cannot file a complaint against yourself."
  list:
    header: "<dark_gray>--- <green>Complaints <dark_gray>---"
    empty: "<gray>No complaints to display."
    row: "<yellow>#{id} <gray>{plaintiff} <dark_gray>-> <gray>{accused} <dark_gray>| {citation} <dark_gray>| <gray>{date} <dark_gray>| {status}"
  detail:
    header: "<dark_gray>--- <green>Complaint #{id} <dark_gray>---"
    plaintiff: "<gray>Plaintiff: <white>{plaintiff}"
    accused: "<gray>Accused: <white>{accused}"
    citation: "<gray>Cited: <white>{citation}"
    sanction: "<gray>Planned sanction: {sanction}"
    details: "<gray>Details: <white>{details}"
    date: "<gray>Date: <white>{date}"
    status: "<gray>Status: {status}"
  status:
    pending: "<yellow>pending"
    handled: "<green>handled"
    dismissed: "<gray>dismissed"
    sanction-to-execute: "<gold>sanction to execute"

citation:
  rule: "<white>Rule {number} <gray>({name})"
  oath: "<white>Oath #{id}"

judge:
  notify: "<gold>New complaint #{id} <gray>from <white>{plaintiff} <gray>against <white>{accused}<gray>."
  pending-on-join: "<gold>{count} complaint(s) awaiting your judgement."
  not-found: "<red>Complaint #{id} does not exist."
  conflict: "<red>You are involved in complaint #{id} and cannot handle it."
  invalid-status: "<red>Unknown status. Use: pending, handled, dismissed."
  superjudge-only: "<red>Only a superjudge can change the cited rule."
  rule-changed: "<green>Complaint #{id}: cited rule changed from <white>{old} <green>to <white>{new}<green>."
  sanction-applied: "<green>Complaint #{id} handled: {sanction}"
  sanction-failed: "<red>The sanction could not be applied: {error}"
  out-of-range: "<red>Value out of range. Allowed: {min} to {max}."
  invalid-value: "<red>Invalid value."
  no-modulation: "<red>This citation cannot be modulated."
  custom-manual: "<red>This is a custom sanction: it cannot be applied automatically. Use /judge done once executed."
  custom-to-execute: "<gold>Complaint #{id}: custom sanction. Execute it, then mark the complaint as done."
  done-not-custom: "<red>Only a custom sanction can be marked as done."
  dismissed: "<gray>Complaint #{id} dismissed without further action."
  done: "<green>Complaint #{id} marked as done."
  ban-reason: "Server rules violation - {citation} (complaint #{id})"

oath:
  usage:
    general: "<gray>Usage: <white>{oath-command} <create|join|accept|refuse|info|cancel>"
    create: "<gray>Usage: <white>{oath-command} create <duration> fine <amount> <promise> <dark_gray>| <gray>{oath-command} create <duration> ban <ban-duration> <promise> <dark_gray>| <gray>{oath-command} create <duration> custom \"<sanction>\" <promise>"
    join: "<gray>Usage: <white>{oath-command} join <code>"
    info: "<gray>Usage: <white>{oath-command} info <id>"
    cancel: "<gray>Usage: <white>{oath-command} cancel <id>"
  players-only: "<red>Only a player can use oaths."
  not-found: "<red>Oath #{id} does not exist."
  status:
    proposed: "<yellow>proposed"
    proposal-expired: "<gray>proposal expired"
    active: "<green>active"
    expired: "<gray>expired"
    cancelled: "<gray>cancelled"
    broken: "<red>broken"
    handled: "<green>handled"
  create:
    created: "<green>Oath #{id} created. Share the code so others can join."
    code: "<gray>Code: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    code-validity: "<gray>The code is valid for <white>{time}<gray>."
    invalid-duration: "<red>The oath duration is invalid."
    invalid-value: "<red>The sanction value is invalid."
  recap:
    header: "<dark_gray>--- <green>Oath #{id} <dark_gray>---"
    founder: "<gray>Founder: <white>{founder}"
    parties: "<gray>Parties: <white>{parties}"
    promise: "<gray>Promise: <white>{promise}"
    duration: "<gray>Duration: <white>{duration}"
    sanction: "<gray>Sanction if broken: {sanction}"
    status: "<gray>Status: {status}"
    code: "<gray>Join code: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
  join:
    prompt: "<gray>Accept with <click:run_command:'{accept}'><green>[Accept]</click> <gray>or refuse with <click:run_command:'{refuse}'><red>[Refuse]</click>."
    lockout: "<red>Too many invalid codes. Try again in {time}."
    invalid: "<red>This oath code is invalid or has expired."
    already-member: "<red>You are already a party to this oath."
    full: "<red>This oath has reached its maximum number of parties."
    none-pending: "<red>You have no pending oath invitation."
    accepted: "<green>You joined oath #{id}."
    refused: "<gray>You declined the invitation to oath #{id}."
    joined-notify: "<green>{player} joined your oath #{id}."
    activated: "<green>Oath #{id} is now active with {count} parties."
  cancel:
    not-allowed: "<red>Oath #{id} can no longer be cancelled."
    not-party: "<red>You are not a party to oath #{id}."
    requested: "<gold>You requested the cancellation of oath #{id}. The other parties must confirm."
    confirm-request: "<gold>{player} wants to cancel oath #{id}. <click:run_command:'{confirm}'><green>[Confirm]</click>"
    already-requested: "<gray>You already requested the cancellation of oath #{id}. Waiting for the other parties."
    confirmed: "<green>You confirmed the cancellation of oath #{id}. Waiting for the other parties."
    cancelled: "<gray>Oath #{id} was cancelled by all parties."
  complaint:
    not-party: "<red>You are not a party to this oath."
    not-allowed: "<red>This oath cannot be cited: it is cancelled or outside the complaint window."

gui:
  players-only: "<red>Only a player can use this menu."
  common:
    back: "<gray>Back"
    close: "<red>Close"
    confirm: "<green>Confirm"
    cancel: "<red>Cancel"
    filler: "<dark_gray> "
    page: "<gray>Page {page}/{pages}"
    previous: "<gray>Previous page"
    next: "<gray>Next page"
    input: "<gold>Type your answer in the chat. <gray>Cancel with <click:run_command:'{cancel}'><red>[Cancel]</click> <gray>or by typing <white>annuler<gray>. <gray>({timeout}s)"
    input-cancelled: "<gray>Input cancelled."
    input-timeout: "<red>The input timed out."
    title:
      confirm: "<dark_gray>Confirm"
  rules:
    title: "<dark_gray>Server rules"
    entry-name: "<white>{number}. {name}"
    entry-description: "<gray>{description}"
    entry-sanction: "<gray>Sanction: {sanction}"
    changed: "<green>New since your last visit"
  complaints:
    title: "<dark_gray>Complaints"
    entry-name: "<white>#{id} - {accused}"
    entry-plaintiff: "<gray>Plaintiff: <white>{plaintiff}"
    entry-citation: "<gray>Cited: <white>{citation}"
    entry-date: "<gray>Date: <white>{date}"
    entry-status: "<gray>Status: {status}"
    empty: "<gray>No complaints to display."
    show-pending: "<yellow>Show pending complaints"
    show-handled: "<green>Show handled complaints"
  complaint-detail:
    title: "<dark_gray>Complaint #{id}"
    apply: "<green>Apply the sanction"
    modulate: "<yellow>Modulate the value"
    modulate-hint: "<gray>Allowed: {min}% to {max}%"
    dismiss: "<gray>Dismiss without further action"
    mark-done: "<gold>Mark as done"
    change-rule: "<aqua>Change the cited rule"
    ask-value: "<gold>Type the new sanction value in the chat (amount or duration)."
    ask-rule: "<gold>Type the number of the new rule to cite."
    info-accused: "<white>{accused}"
    info-plaintiff: "<gray>Plaintiff: <white>{plaintiff}"
    info-citation: "<gray>Cited: <white>{citation}"
    info-parties: "<gray>Parties: <white>{parties}"
    info-sanction: "<gray>Planned sanction: {sanction}"
    info-details: "<gray>Details: <white>{details}"
    info-date: "<gray>Date: <white>{date}"
    info-status: "<gray>Status: {status}"
  player-complaints:
    title: "<dark_gray>My complaints"
    entry-name: "<white>#{id} - {accused}"
    entry-citation: "<gray>Cited: <white>{citation}"
    entry-date: "<gray>Date: <white>{date}"
    entry-status: "<gray>Status: {status}"
    empty: "<gray>You have not filed any complaint."
    new: "<green>New complaint"
    ask-accused: "<gold>Type the name of the accused player in the chat."
  new-complaint:
    title: "<dark_gray>New complaint - {accused}"
    rules-button: "<green>Rules"
    oaths-button: "<gold>Oaths"
    entry-rule: "<white>Rule {number}. {name}"
    entry-oath: "<white>Oath #{id}"
    no-oath: "<gray>No shared oath can be cited."
    ask-details: "<gold>Describe the facts in the chat."
    recap-title: "<dark_gray>Confirm the complaint"
    recap-accused: "<gray>Accused: <white>{accused}"
    recap-citation: "<gray>Cited: <white>{citation}"
    recap-details: "<gray>Details: <white>{details}"
  oaths:
    title: "<dark_gray>My oaths"
    expired-title: "<dark_gray>Expired oaths"
    entry-name: "<white>Oath #{id}"
    entry-founder: "<gray>Founder: <white>{founder}"
    entry-parties: "<gray>Parties: <white>{parties}"
    entry-promise: "<gray>Promise: <white>{promise}"
    entry-status: "<gray>Status: {status}"
    empty: "<gray>You have no active oath."
    expired-empty: "<gray>You have no expired oath."
    join: "<green>Join an oath"
    create: "<yellow>Create an oath"
    expired: "<gray>Expired oaths"
    ask-code: "<gold>Type the oath code in the chat."
    join-title: "<dark_gray>Join oath #{id}"
    join-accept: "<green>Accept"
    join-refuse: "<red>Refuse"
    detail-title: "<dark_gray>Oath #{id}"
    detail-duration: "<gray>Duration: <white>{duration}"
    detail-sanction: "<gray>Sanction if broken: {sanction}"
    detail-code: "<gray>Join code: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    cancel-request: "<red>Request cancellation"
    cancel-confirm: "<red>Confirm cancellation"
    complain: "<yellow>File a complaint"
    complain-title: "<dark_gray>Complaint - oath #{id}"
    complain-entry: "<white>{player}"
    complain-empty: "<red>No other party can be accused."
    ask-details: "<gold>Describe the facts in the chat."
  oath-create:
    title: "<dark_gray>Create an oath"
    ask-duration: "<gold>Type the oath duration in the chat (e.g. 7d)."
    entry-fine: "<gold>Fine"
    entry-ban: "<yellow>Temporary ban"
    entry-custom: "<gray>Custom sanction"
    ask-amount: "<gold>Type the fine amount in the chat."
    ask-ban: "<gold>Type the ban duration in the chat."
    ask-custom: "<gold>Describe the custom sanction in the chat."
    ask-promise: "<gold>Type the promise in the chat."
    recap-title: "<dark_gray>Confirm the oath"
    recap-duration: "<gray>Duration: <white>{duration}"
    recap-sanction: "<gray>Sanction if broken: {sanction}"
    recap-promise: "<gray>Promise: <white>{promise}"
  manage:
    title: "<dark_gray>Manage rules"
    entry-name: "<white>{number}. {name}"
    entry-description: "<gray>{description}"
    entry-sanction: "<gray>Sanction: {sanction}"
    up: "<yellow>Move up"
    down: "<yellow>Move down"
    delete: "<red>Delete"
    empty: "<gray>No rules have been defined yet."
    add: "<green>Add a rule"
    add-title: "<dark_gray>New rule #{number}"
    edit-title: "<dark_gray>Edit rule #{number}"
    edit-name: "<white>Name"
    edit-description: "<white>Description"
    edit-type: "<white>Type: <yellow>{type}"
    edit-value: "<white>Value"
    edit-save: "<green>Save"
    ask-name: "<gold>Type the rule name in the chat."
    name-required: "<red>The name is required."
    ask-description: "<gold>Type the rule description in the chat."
    ask-amount: "<gold>Type the fine amount in the chat."
    ask-duration: "<gold>Type the ban duration in the chat."
    type-fine: "fine"
    type-ban: "temporary ban"
