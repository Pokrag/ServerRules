# ServerRules - Deutsch
prefix: "<dark_gray>[<green>ServerRules<dark_gray>] <reset>"

error:
  vault-missing: "Vault ist nicht installiert. ServerRules benötigt Vault."
  economy-missing: "Es ist kein Wirtschaftsanbieter bei Vault registriert. Installiere EssentialsX und aktiviere dessen Wirtschaft."
  economy-not-essentials: "Der Wirtschaftsanbieter von Vault ist nicht EssentialsX (gefunden: {provider}). ServerRules benötigt EssentialsX."
  database: "Ein interner Datenbankfehler ist aufgetreten. Bitte versuche es erneut."
  invalid-amount: "Der Betrag ist ungültig."
  invalid-duration: "Die Dauer ist ungültig."
  fine-refused: "Das Wirtschaftsplugin hat die Abbuchung abgelehnt (negative Kontostände sind möglicherweise deaktiviert)."
  ban-failed: "Der Bann konnte nicht angewendet werden."

rules:
  header: "<dark_gray>------- <green>Serverregeln <dark_gray>-------"
  footer: "<dark_gray>----------------------------"
  row: "<yellow>{number}. <white>{name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
  empty: "<gray>Es wurden noch keine Regeln festgelegt."
  not-found: "<red>Die Regel {number} existiert nicht."
  single-header: "<dark_gray>------- <green>Regel {number} <dark_gray>-------"
  sanction:
    fine: "<red>Geldstrafe: {amount}"
    temp-ban: "<red>Temporärer Bann: {duration}"
  changes:
    header: "<dark_gray>--- <green>Regeländerungen seit deinem letzten Besuch <dark_gray>---"
    added: "<green>[+] Regel {number}. {name}"
    modified: "<yellow>[~] Regel {number}. {name}"
    removed: "<red>[-] Regel {number}. {name}"
    none: "<gray>Keine Regeländerungen seit deinem letzten Besuch."
    footer: "<gray>Tippe <white>{rules-command} <gray>, um alle Regeln zu sehen."
  admin:
    usage:
      add: "<gray>Verwendung: <white>{rules-command} add <Name> <fine|ban> <Wert> [Beschreibung]"
      edit: "<gray>Verwendung: <white>{rules-command} edit <Nr.> <Name> <fine|ban> <Wert> [Beschreibung]"
      remove: "<gray>Verwendung: <white>{rules-command} remove <Nr.>"
      move: "<gray>Verwendung: <white>{rules-command} move <Nr.> <Position>"
    pending-header: "<gold>Ausstehende Änderung:"
    pending-add: "<green>[+] Regel {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-edit: "<yellow>[~] Regel {number}. {name} <dark_gray>| <gray>{description} <dark_gray>| {sanction}"
    pending-remove: "<red>[-] Regel {number}. {name}"
    pending-note: "<gray>Bestätige mit <click:run_command:'{confirm}'><green>[Bestätigen]</click> <gray>oder brich ab mit <click:run_command:'{cancel}'><red>[Abbrechen]</click> <gray>innerhalb von {timeout} Sekunden."
    confirmed: "<green>Die Änderung wurde angewendet."
    cancelled: "<gray>Die ausstehende Änderung wurde abgebrochen."
    nothing-pending: "<red>Es gibt keine ausstehende Änderung zum Bestätigen."
    pending-expired: "<red>Deine ausstehende Änderung ist abgelaufen. Bitte beginne von vorn."
    moved: "<green>Regel verschoben: {number} -> {position}."
    invalid-position: "<red>Ungültige Position: {position}."
    reloaded: "<green>Konfiguration, Sprachen und Regeln neu geladen."

complaint:
  usage: "<gray>Verwendung: <white>/plaint <Spieler> <Regelnummer> <Details>"
  players-only: "<red>Nur ein Spieler kann eine Beschwerde einreichen."
  deposited: "<green>Deine Beschwerde #{id} wurde an die Richter gesendet."
  cooldown: "<red>Bitte warte {time}, bevor du eine weitere Beschwerde einreichst."
  rule-not-found: "<red>Die Regel {number} existiert nicht."
  oath-invalid: "<red>Die Schwur-Referenz {reference} ist ungültig. Verwende oath:<id>."
  player-not-found: "<red>Der Spieler {player} ist unbekannt."
  self: "<red>Du kannst keine Beschwerde gegen dich selbst einreichen."
  list:
    header: "<dark_gray>--- <green>Beschwerden <dark_gray>---"
    empty: "<gray>Keine Beschwerden zum Anzeigen."
    row: "<yellow>#{id} <gray>{plaintiff} <dark_gray>-> <gray>{accused} <dark_gray>| {citation} <dark_gray>| <gray>{date} <dark_gray>| {status}"
  detail:
    header: "<dark_gray>--- <green>Beschwerde #{id} <dark_gray>---"
    plaintiff: "<gray>Klagender: <white>{plaintiff}"
    accused: "<gray>Beschuldigter: <white>{accused}"
    citation: "<gray>Zitiert: <white>{citation}"
    sanction: "<gray>Geplante Sanktion: {sanction}"
    details: "<gray>Details: <white>{details}"
    date: "<gray>Datum: <white>{date}"
    status: "<gray>Status: {status}"
  status:
    pending: "<yellow>ausstehend"
    handled: "<green>behandelt"
    dismissed: "<gray>verworfen"
    sanction-to-execute: "<gold>Sanktion auszuführen"

citation:
  rule: "<white>Regel {number} <gray>({name})"
  oath: "<white>Schwur #{id}"

judge:
  notify: "<gold>Neue Beschwerde #{id} <gray>von <white>{plaintiff} <gray>gegen <white>{accused}<gray>."
  pending-on-join: "<gold>{count} Beschwerde(n) warten auf dein Urteil."
  not-found: "<red>Die Beschwerde #{id} existiert nicht."
  conflict: "<red>Du bist an Beschwerde #{id} beteiligt und kannst sie nicht bearbeiten."
  invalid-status: "<red>Unbekannter Status. Verwende: pending, handled, dismissed."
  superjudge-only: "<red>Nur ein Oberrichter kann die zitierte Regel ändern."
  rule-changed: "<green>Beschwerde #{id}: zitierte Regel geändert von <white>{old} <green>zu <white>{new}<green>."
  sanction-applied: "<green>Beschwerde #{id} behandelt: {sanction}"
  sanction-failed: "<red>Die Sanktion konnte nicht angewendet werden: {error}"
  out-of-range: "<red>Wert außerhalb des Bereichs. Erlaubt: {min} bis {max}."
  invalid-value: "<red>Ungültiger Wert."
  no-modulation: "<red>Diese Zitierung kann nicht angepasst werden."
  custom-manual: "<red>Dies ist eine benutzerdefinierte Sanktion: sie kann nicht automatisch angewendet werden. Verwende /judge done, sobald sie ausgeführt wurde."
  custom-to-execute: "<gold>Beschwerde #{id}: benutzerdefinierte Sanktion. Führe sie aus und markiere die Beschwerde dann als erledigt."
  done-not-custom: "<red>Nur eine benutzerdefinierte Sanktion kann als erledigt markiert werden."
  dismissed: "<gray>Beschwerde #{id} ohne weitere Maßnahmen verworfen."
  done: "<green>Beschwerde #{id} als erledigt markiert."
  ban-reason: "Verstoß gegen die Serverregeln - {citation} (Beschwerde #{id})"

oath:
  usage:
    general: "<gray>Verwendung: <white>{oath-command} <create|join|accept|refuse|info|cancel>"
    create: "<gray>Verwendung: <white>{oath-command} create <Dauer> fine <Betrag> <Versprechen> <dark_gray>| <gray>{oath-command} create <Dauer> ban <Bann-Dauer> <Versprechen> <dark_gray>| <gray>{oath-command} create <Dauer> custom \"<Sanktion>\" <Versprechen>"
    join: "<gray>Verwendung: <white>{oath-command} join <Code>"
    info: "<gray>Verwendung: <white>{oath-command} info <Nr.>"
    cancel: "<gray>Verwendung: <white>{oath-command} cancel <Nr.>"
  players-only: "<red>Nur ein Spieler kann Schwüre verwenden."
  not-found: "<red>Der Schwur #{id} existiert nicht."
  status:
    proposed: "<yellow>vorgeschlagen"
    proposal-expired: "<gray>Vorschlag abgelaufen"
    active: "<green>aktiv"
    expired: "<gray>abgelaufen"
    cancelled: "<gray>storniert"
    broken: "<red>gebrochen"
    handled: "<green>behandelt"
  create:
    created: "<green>Schwur #{id} erstellt. Teile den Code, damit andere beitreten können."
    code: "<gray>Code: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
    code-validity: "<gray>Der Code ist <white>{time}<gray> lang gültig."
    invalid-duration: "<red>Die Dauer des Schwurs ist ungültig."
    invalid-value: "<red>Der Wert der Sanktion ist ungültig."
  recap:
    header: "<dark_gray>--- <green>Schwur #{id} <dark_gray>---"
    founder: "<gray>Gründer: <white>{founder}"
    parties: "<gray>Parteien: <white>{parties}"
    promise: "<gray>Versprechen: <white>{promise}"
    duration: "<gray>Dauer: <white>{duration}"
    sanction: "<gray>Sanktion bei Bruch: {sanction}"
    status: "<gray>Status: {status}"
    code: "<gray>Beitrittscode: <gold><click:copy_to_clipboard:'{code}'>{code}</click>"
  join:
    prompt: "<gray>Akzeptiere mit <click:run_command:'{accept}'><green>[Akzeptieren]</click> <gray>oder lehne ab mit <click:run_command:'{refuse}'><red>[Ablehnen]</click>."
    lockout: "<red>Zu viele ungültige Codes. Versuche es in {time} erneut."
    invalid: "<red>Dieser Schwur-Code ist ungültig oder abgelaufen."
    already-member: "<red>Du bist bereits Partei dieses Schwurs."
    full: "<red>Dieser Schwur hat die maximale Anzahl an Parteien erreicht."
    none-pending: "<red>Du hast keine offene Schwur-Einladung."
    accepted: "<green>Du bist dem Schwur #{id} beigetreten."
    refused: "<gray>Du hast die Einladung zum Schwur #{id} abgelehnt."
    joined-notify: "<green>{player} ist deinem Schwur #{id} beigetreten."
    activated: "<green>Der Schwur #{id} ist jetzt mit {count} Parteien aktiv."
  cancel:
    not-allowed: "<red>Der Schwur #{id} kann nicht mehr storniert werden."
    not-party: "<red>Du bist keine Partei des Schwurs #{id}."
    requested: "<gold>Du hast die Stornierung des Schwurs #{id} beantragt. Die anderen Parteien müssen bestätigen."
    confirm-request: "<gold>{player} möchte den Schwur #{id} stornieren. <click:run_command:'{confirm}'><green>[Bestätigen]</click>"
    already-requested: "<gray>Du hast die Stornierung des Schwurs #{id} bereits beantragt. Warte auf die anderen Parteien."
    confirmed: "<green>Du hast die Stornierung des Schwurs #{id} bestätigt. Warte auf die anderen Parteien."
    cancelled: "<gray>Der Schwur #{id} wurde von allen Parteien storniert."
  complaint:
    not-party: "<red>Du bist keine Partei dieses Schwurs."
    not-allowed: "<red>Dieser Schwur kann nicht zitiert werden: er ist storniert oder außerhalb des Beschwerdefensters."
